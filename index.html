    }
  }

  // The four panels of the distribution page, in the order the layout engine packs them.
  const DIST = [
    { name: 'Stress spread', draw: m => renderHist(m) },
    { name: 'Active by hour', draw: m => renderHour(m) },
    { name: 'Per cat', draw: m => renderDots(m) },
    { name: 'Shelter totals', draw: m => renderTotals(m) },
  ];
  function render() {
    if (!sol) return;
    const metrics = selectedMetrics();
    const trendSlots = sol.rects.filter(r => /^trend-\d+$/.test(r.id)).length;
    const smSlots = sol.rects.filter(r => /^sm-\d+$/.test(r.id)).length;
    for (const [id, m] of made) {
      const q = m.rect;
      if (id === 'stats-tabs') renderTabs(m);
      else if (id === 'sel-panel') renderPanel(m);
      else if (id.startsWith('sel-')) renderSelector(m, id.slice(4));
      else if (id === 'trends-pager') renderPager(m, 'trends', Math.max(1, Math.ceil(metrics.length / Math.max(1, trendSlots))), `Page ${pageAt('trends') + 1}`);
      else if (id === 'percat-pager') renderPager(m, 'percat', Math.max(1, Math.ceil(selectedCats().length / Math.max(1, smSlots))), `Page ${pageAt('percat') + 1}`);
      else if (id === 'dist-pager') renderPager(m, 'dist', DIST.length, DIST[pageAt('dist') % DIST.length].name);
      else if (id === 'matrix-pager') renderPager(m, 'matrixRow', Math.max(1, Math.ceil(selectedCats().length / (q.block || selectedCats().length))), `Rows ${pageAt('matrixRow') + 1}`);
      else if (id === 'aff-pager') renderPager(m, 'aff', 2, 'Page');
      else if (id === 'table-pager') {
        const t = made.get('table'), rws = (t && t.rect.rows) || 1, cls = (t && t.rect.cols) || 1;
        const rowPages = Math.max(1, Math.ceil(selectedCats().length / rws)), colPages = Math.max(1, Math.ceil(TABLE_COLS.length / cls));
        const at = pageAt('table') % (colPages * rowPages);
        renderPager(m, 'table', colPages * rowPages, `Page ${at + 1} of ${colPages * rowPages}`);
      }
      else if (/^trend-(\d+)$/.test(id)) { m.perPage = trendSlots; renderTrend(m, +id.split('-')[1]); }
      else if (/^sm-(\d+)$/.test(id)) { m.perPage = smSlots; renderSmallMultiple(m, +id.split('-')[1]); }
      else if (/^aff-(\d+)$/.test(id)) renderAffRow(m, +id.split('-')[1]);
      else if (id === 'dist-hist') { // where the body carries one panel at a time, this rectangle is
        // whichever of the four the pager is on; where all four are laid out, it is the histogram.
        const paged = !made.has('dist-hour');
        (paged ? DIST[pageAt('dist') % DIST.length].draw : renderHist)(m);
      }
      else if (id === 'dist-hour') renderHour(m);
      else if (id === 'dist-dots') renderDots(m);
      else if (id === 'dist-totals') renderTotals(m);
      else if (id === 'matrix') renderMatrix(m);
      else if (id === 'table') renderTable(m);
      else if (id === 'record') renderRecord(m);
      else if (id === 'chart-key') renderKey(m);
    }
  }
  return { attach, place, tick: render, get solution() { return sol; } };
})();


// ---------------------------------------------------------------- the frame
function renderAll() {
  for (const r of regions.values()) if (r.api.tick) r.api.tick();
}
let lastFrame = performance.now();
function frame(now) {
  const dtr = Math.min(0.25, (now - lastFrame) / 1000); lastFrame = now;
  if (!paused) {
    acc += dtr * TICKS_PER_SEC * speed;
    let n = 0; const t0 = performance.now();
    while (acc >= 1 && n < MAX_STEPS) { sim.step(); acc -= 1; n++; if (performance.now() - t0 > 12) break; }
    if (acc > MAX_STEPS) acc = MAX_STEPS;
  }
  if (UI.view === 'room') ROOM.draw(now, paused ? 1 : Math.min(1, acc));
  if (now - (frame.ui || 0) > 220) { frame.ui = now; watchForMarkers(); renderAll(); }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- speed and keys
const fmtX = s => (s >= 1 ? +s.toFixed(s < 10 ? 1 : 0) : +s.toFixed(2)) + 'x';
function setSpeed(s, save = true) {
  speed = Math.min(SP_MAX, Math.max(SP_MIN, +s || 1));
  if (save) store.set('wh.speed', String(speed));
  renderAll();
}
function stepSpeed(d) {
  const i = SP_STEPS.findIndex(v => v >= speed - 1e-6);
  let k = d > 0 ? (SP_STEPS[i] > speed + 1e-6 ? i : i + 1) : i - 1;
  setSpeed(SP_STEPS[Math.max(0, Math.min(SP_STEPS.length - 1, k))]);
}
function togglePause() { paused = !paused; renderAll(); }
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); togglePause(); }
  else if (k === '-' || k === '_') stepSpeed(-1);
  else if (k === '+' || k === '=') stepSpeed(1);
  else if (k === 'escape') { if (UI.stats.open !== 'none') { UI.stats.open = 'none'; applyLayout(); } else if (UI.view !== 'room') setView('room'); else if (UI.selected) selectCat(null); }
});

// ---------------------------------------------------------------- the run
function newColony(seed) {
  sim = new PlaySim(Object.assign({ seed: seed || (1 + Math.floor(Math.random() * 1e6)) }, SHELTER, schedule));
  UI.selected = sim.nachshon; UI.marker = null; UI.view = UI.view === 'stats' || UI.view === 'guide' ? UI.view : 'room';
  UI.stats.cats = new Set(sim.cats.map(c => c.id));
  UI.stats.page_ = {};
  acc = 0; drag = null; downAt = null; hoverCat = null; hoverObject = null;
  pendingFight = null; seenFights = sim.stats.resolvedFights || 0; seenCats = new Set(sim.cats.map(c => c.id));
  attachFightHook();
  ROOM.invalidate();
  applyLayout();
}
// Everything behind the live feed and the statistics view, written out as one file. The numbers are
// the ones drawn on screen; nothing is rounded away.
function exportData() {
  return { generated: new Date().toISOString(), seed: sim.cfg.seed, clock: sim.clock(), t: sim.t,
    schedule: JSON.parse(JSON.stringify(schedule)), summary: sim.summary(), samples: sim.samples, log: sim.log };
}
function exportLogs() {
  const blob = new Blob([JSON.stringify(exportData(), null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'whisker-hall-' + sim.cfg.seed + '.json';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// ---------------------------------------------------------------- boot
let resizeTimer = null;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(applyLayout, 60); });
function boot() {
  setSpeed(+store.get('wh.speed') || 1, false);
  newColony(7);
  requestAnimationFrame(frame);
}

// The UI's driving surface: one entry for everything the player can do, and read access to what is on
// screen, so a headless check can drive the game exactly as a person does and never has to reach into
// the DOM to do it.
root.Play = {
  // read what is on screen
  get sim() { return sim; },
  get selected() { return UI.selected; }, set selected(c) { selectCat(c); },
  get speed() { return speed; }, get paused() { return paused; },
  get schedule() { return schedule; },
  get view() { return UI.view; }, get form() { return FORM; },
  get layout() { return SOL; }, get statsLayout() { return STATS.solution; },
  get state() { return UI; },
  S: () => ROOM.S,
  exportData,
  // what the player can do
  togglePause, setSpeed, newColony, exportLogs,
  setView, selectCat,
  openEditor(key) { toggleEditor(key); },
  setStatsPage(p) { UI.stats.page = p; UI.stats.open = 'none'; applyLayout(); },
  openSelector(id) { UI.stats.open = UI.stats.open === id ? 'none' : id; applyLayout(); },
  setSchedule(o) { schedule = CS.merge(defaultSchedule(), o || {}); applySchedule(); },
  setDoor(which, open) { sim.setDoor(which, open); renderAll(); },
  moveStation(id, x, y) { const moved = sim.moveStation(id, x, y); ROOM.invalidate(); return moved; },
  // not a player action: world events arrive on their own. Here so a check can make one happen on cue.
  triggerEvent(type) {
    if (type === 'newcomer' && sim.cats.length >= (sim.cfg.maxCats || 16)) { sim.emit('The shelter is full: no newcomer admitted', 'event'); renderAll(); return; }
    sim.trigger(type); renderAll();
  },
  // and so a check can put a marker on the room without waiting for one to happen
  mark(kind) { const a = sim.cats[0], b = sim.cats[1]; if (!a) return;
    if (kind === 'fight' && b) markEvent('fight', (a.x + b.x) / 2, (a.y + b.y) / 2, `A fight between ${a.name} and ${b.name}`);
    else if (kind === 'fight') markEvent('fight', a.x, a.y, `A fight involving ${a.name}`);
    else markEvent('arrival', a.x, a.y, `${a.name} arrives in the shelter`);
    renderAll(); },
};
boot();
})(typeof self !== 'undefined' ? self : this);
