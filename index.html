<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Whisker Hall: cat shelter simulation</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='62' r='22' fill='%23355f86'/%3E%3Ccircle cx='24' cy='36' r='10' fill='%23355f86'/%3E%3Ccircle cx='42' cy='22' r='10' fill='%23355f86'/%3E%3Ccircle cx='60' cy='22' r='10' fill='%23355f86'/%3E%3Ccircle cx='77' cy='36' r='10' fill='%23355f86'/%3E%3C/svg%3E">
<style>
/* Every value below is a custom property generated from src/tokens.js by build-play.js. No colour,
   size or spacing is written here by hand: the tokens file is the only place one is decided. */
:root{
 --bg:#f6efe3;
 --surface:#fffcf6;
 --surfaceAlt:#f8f1e4;
 --ink:#2e241d;
 --muted:#6a5646;
 --line:#e6d8c3;
 --lineStrong:#8d7660;
 --accent:#355f86;
 --accentInk:#ffffff;
 --accentSoft:#e3ebf3;
 --open:#335d2e;
 --staffCats:#3d7a3a;
 --staffLitter:#c4501f;
 --header:#4a3a2e;
 --headerInk:#fff6ea;
 --track:#efe3d0;
 --need:#a8661f;
 --trait:#557848;
 --good:#43703e;
 --goodSoft:#e5efdc;
 --warn:#a3400f;
 --warnSoft:#fbe6d8;
 --alert:#b02a22;
 --alertSoft:#fbe1dc;
 --scrim:rgba(46, 36, 29, 0.45);
 --room-floor:#e8cfa6;
 --room-floorGrain:#dec396;
 --room-seam:#b89366;
 --room-rug:#d9e1cb;
 --room-rugWeave:#b9c7a3;
 --room-rugEdge:#5f7a4d;
 --room-wall:#6b4f3a;
 --room-wallInk:#4a3528;
 --room-light:#fff8e6;
 --room-shadow:rgba(60, 40, 20, 0.16);
 --room-propInk:#2b2118;
 --room-doorOpen:#335d2e;
 --room-doorShut:#9c231b;
 --room-tooltipBg:#3a2c22;
 --room-tooltipInk:#fff6ea;
 --fs-ui:14px;
 --fs-prose:15px;
 --fs-lead:16px;
 --fs-value:22px;
 --fs-display:28px;
 --lh-ui:21px;
 --lh-prose:24px;
 --lh-lead:24px;
 --lh-value:28px;
 --fw-normal:400;
 --fw-medium:600;
 --fw-bold:700;
 --sp-xs:4px;
 --sp-sm:8px;
 --sp-md:12px;
 --sp-lg:16px;
 --sp-xl:24px;
 --sz-target:44px;
 --sz-bar:56px;
 --sz-card:56px;
 --sz-icon:18px;
 --sz-iconSmall:12px;
 --sz-logHeader:24px;
 --sz-logPad:4px;
 --sz-barTrack:7px;
 --sz-catScale:1.35px;
 --r-sm:4px;
 --r-md:8px;
 --r-lg:12px;
 --r-pill:999;
 --el-flat:none;
 --el-card:0 1px 2px rgba(46, 36, 29, 0.07);
 --el-raised:0 4px 14px rgba(46, 36, 29, 0.14);
 --mo-fast:120ms;
 --mo-normal:200ms;
 --font-stack:"Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);
 font:var(--fw-normal) var(--fs-ui)/var(--lh-ui) var(--font-stack);
 -webkit-font-smoothing:antialiased}

/* ---------- regions ----------
   One absolutely positioned element per rectangle the layout engine solves, placed from
   src/layout.js. Nothing in this stylesheet decides where anything goes; it decides only what a
   region looks like once it has been put there. */
#app{position:absolute;inset:0;overflow:hidden}
.region{position:absolute;overflow:hidden;display:flex}
.panel{position:absolute;inset:1px;background:var(--surface);border:1px solid var(--line);
 border-radius:var(--r-lg);box-shadow:var(--el-card);overflow:hidden;display:flex;flex-direction:column}
.panel.flat{background:transparent;border:0;box-shadow:none}
.panel.pad{padding:var(--sp-md)}

/* ---------- controls ---------- */
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:var(--sp-sm);
 width:100%;height:100%;min-height:var(--sz-target);padding:0 var(--sp-md);
 font-weight:var(--fw-bold);color:var(--ink);background:var(--surface);
 border:1px solid var(--line);border-radius:var(--r-md);white-space:nowrap;
 transition:background var(--mo-fast),border-color var(--mo-fast)}
.btn:hover{border-color:var(--accent);background:var(--accentSoft)}
.btn[aria-pressed="true"],.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.btn.quiet{border-color:transparent;background:transparent}
.btn.quiet:hover{border-color:var(--accent);background:var(--accentSoft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--r-sm)}

input[type=number],input[type=time],select{font:inherit;font-weight:var(--fw-bold);color:var(--ink);
 background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
 min-height:var(--sz-target);padding:0 var(--sp-sm);text-align:center}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
input[type=range]{accent-color:var(--accent);height:var(--sz-target);cursor:pointer;margin:0}

/* ---------- clock and transport ---------- */
.clock{display:flex;align-items:center;justify-content:center;width:100%;height:100%;
 font-size:var(--fs-lead);line-height:var(--lh-lead);font-weight:var(--fw-bold);
 font-variant-numeric:tabular-nums;white-space:nowrap}
.speed{display:flex;align-items:center;gap:var(--sp-sm);width:100%;height:100%;padding:0 var(--sp-md)}
.speed input{flex:1 1 auto;min-width:0}
.speed .read{flex:none;font-weight:var(--fw-bold);font-variant-numeric:tabular-nums;white-space:nowrap}
/* Every form opens with one BAR_H bar across the top, and desktop adds the plan row under it, so the
   header colour is a band of exactly that height behind the page (--sz-top, set from the solved
   layout): everything the caregiver does reads as one strip heading the screen. The clock and the speed
   read-out sit on it directly; buttons and cards keep their surfaces. */
#app{background:linear-gradient(to bottom,var(--header) var(--sz-bar),transparent var(--sz-bar))}
#r-clock,#r-speed{color:var(--headerInk)}
#r-speed input[type=range]{accent-color:var(--headerInk)}

/* ---------- the three kinds of control on the header band ----------
   Built by control() in play.js. Each kind differs from the others in fill, outline and weight, so a
   caregiver tells them apart before reading a word. None draws a border: rings are inset shadows, so a
   face's whole measured width is the width the layout engine reserved for its icon and label. */
/* A filled face is inset in its cell: (bar - target) / 2 above and below, GAP / 2 at the sides, which
   the engine reserves as FACE_X, so neighbouring faces stand GAP apart. */
.region.face{padding:calc((var(--sz-bar) - var(--sz-target)) / 2) calc(var(--sp-sm) / 2)}
.ico{flex:none;width:var(--sz-icon);height:var(--sz-icon);fill:none;stroke:currentColor;stroke-width:2;
 stroke-linecap:round;stroke-linejoin:round}
.ico .f{fill:currentColor;stroke:none}
/* Primary: a raised face with an icon. Pause is the main one: solid accent with light ink, ringed in
   the strip's ink, the same in both states. Controls (phone landscape) is a cream face. */
.btn.primary,.card{border:0;background:var(--surface);color:var(--ink);box-shadow:var(--el-raised)}
.btn.primary .ico,.card .ico{color:var(--accent)}
.btn.primary:hover,.card:hover{background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent),var(--el-raised)}
.btn.primary[aria-pressed="true"],.card[aria-expanded="true"]{background:var(--accentSoft);color:var(--ink);
 box-shadow:inset 0 0 0 2px var(--accent)}
.btn.primary.main,.btn.primary.main:hover{background:var(--accent);color:var(--accentInk);
 box-shadow:inset 0 0 0 2px var(--headerInk),var(--el-raised)}
.btn.primary.main .ico{color:var(--accentInk)}
.btn.primary.main:hover{box-shadow:inset 0 0 0 3px var(--headerInk),var(--el-raised)}
.btn.primary.iconOnly{padding:0}
.btn.primary.iconOnly .lb{display:none}
/* Restart is a link in the corner: its word, 6px either side, or ↻ alone on a full target. */
.btn.nav.icon{justify-content:center;font-size:var(--fs-lead)}
.btn.nav.word{justify-content:center;padding:0 6px}
/* Restart and the navigation sit on the band wherever the engine puts them: the top bar, or the bottom
   bar of phone portrait, which the top-of-page band does not reach. */
#r-restart,#r-toggle-view,#r-btn-guide,#r-btn-move{background:var(--header)}
/* Restart's confirmation, anchored to the link. The only element that floats, and only until answered. */
.confirm{position:fixed;z-index:10;display:flex;align-items:center;gap:var(--sp-sm);padding:var(--sp-sm) var(--sp-md);
 background:var(--surface);color:var(--ink);border-radius:var(--r-md);box-shadow:var(--el-raised),inset 0 0 0 1px var(--lineStrong);
 font-weight:var(--fw-bold);white-space:nowrap}
.confirm .btn{width:auto;height:var(--sz-target);min-width:var(--sz-target)}
.confirm .btn.yes{background:var(--alert);border-color:var(--alert);color:var(--accentInk)}
/* Navigation: a link in the bar's corner, no face at all; Restart is drawn the same way. The view
   that is open is underlined. Its label sits at the cell's end, so where the engine gives the toggle
   the width between Restart and the Guide (phone portrait) the links still read as one corner group. */
.btn.nav{border:0;border-radius:0;background:transparent;color:var(--headerInk);justify-content:flex-end}
.btn.nav .lb{padding:2px 0;border-bottom:2px solid transparent}
.btn.nav:hover{background:transparent}
.btn.nav:hover .lb{border-bottom-color:var(--headerInk)}
.btn.nav[aria-pressed="true"]{background:transparent;color:var(--headerInk)}
.btn.nav[aria-pressed="true"] .lb{border-bottom:2px solid var(--headerInk)}
:focus-visible.nav{outline-color:var(--headerInk)}

/* ---------- plan chips ----------
   Feeding, Litter, Visitors, Vacuum: main's two-line chip. A short title and its triangle (a filled
   accent chip, part of the button) over the plan without its times. The four sit on one shared tint
   with a hairline between them, so they read as one group apart from the transport. */
.region.plangroup{padding:calc((var(--sz-bar) - var(--sz-target)) / 2) 0;background:var(--header)}
.card{display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:0;width:100%;height:100%;
 padding:0 var(--sp-sm);text-align:left;cursor:pointer;min-width:0;border-radius:0;
 background:var(--accentSoft);color:var(--ink);box-shadow:inset -1px 0 0 var(--lineStrong)}
#r-card-feeding .card,.controlsview .card{border-radius:var(--r-md) 0 0 var(--r-md)}
#r-card-vacuum .card{border-radius:0 var(--r-md) var(--r-md) 0;box-shadow:none}
.controlsview .card{border-radius:var(--r-md);box-shadow:none}
.card:hover{background:var(--surface)}
.card[aria-expanded="true"]{background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent)}
.card .head{display:flex;align-items:center;gap:var(--sp-xs);min-width:0;height:var(--lh-ui)}
.card .title{font-weight:var(--fw-bold);white-space:nowrap}
.card .tri{flex:none;display:flex;align-items:center;justify-content:center;width:calc(var(--sz-iconSmall) + 4px);height:calc(var(--sz-iconSmall) + 4px);
 border-radius:var(--r-sm);background:var(--accent);color:var(--accentInk);font-size:var(--fs-ui);line-height:1}
.card .line{line-height:var(--lh-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- editors ----------
   In main's place. At the top, the plan in full with its times, the budget bar and the timeline; then
   main's fields. */
.editorview{position:absolute;inset:0;display:flex;flex-direction:column}
.editorview > .editor{flex:1 1 0;height:auto;min-height:0}
.editor{display:flex;flex-direction:column;gap:4px;width:100%;height:100%;padding:var(--sp-md);
 background:var(--accentSoft);border:1px solid var(--accent);border-radius:var(--r-md)}
.editor .sentence{margin:0;font-weight:var(--fw-bold);line-height:var(--lh-ui)}
.editor .budget{display:flex;align-items:center;gap:var(--sp-sm);line-height:var(--lh-ui)}
.editor .budget .bar{width:40px;height:var(--sz-barTrack);border-radius:var(--r-pill);background:var(--track);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.editor .budget .bar > i{display:block;height:100%;background:var(--accent)}
.editor .bt{color:var(--muted);flex:1 1 0;min-width:0}
.editor .budget .bar{flex:none}
.editor .tl.big{display:block;flex:none;height:34px;width:100%}
.editor .legend{margin:calc(var(--sp-sm) * -1 + 2px) 0 0;color:var(--muted);line-height:var(--lh-ui)}
.editor .fields{display:flex;flex-wrap:wrap;gap:var(--sp-sm);align-content:flex-start}
.field{display:flex;flex:none;align-items:center;gap:var(--sp-sm);white-space:nowrap}
.field > span{color:var(--muted);font-weight:var(--fw-bold)}
.field input{width:53px}
/* The hours setting is one field with two inputs; its words sit closer so it stays within one number field's reserve. */
/* The hours: two halves, "Between [10]:00" and "and [19]:00", which wrap onto two rows where narrow. */
.field.window{flex:1 1 100%;flex-wrap:wrap;gap:var(--sp-sm);min-width:0}
.field.window .half{display:flex;align-items:center;gap:4px;padding-right:1px}
/* The meal or clean count takes its own row, then the times wrap in rows of TARGET + GAP. */
.field.times{flex:1 1 100%;flex-wrap:wrap;white-space:normal;row-gap:var(--sp-sm)}
.field.times input{flex:none}

/* ---------- the shelter goals chart ----------
   In the live feed's footprint. Desktop: the legend entries, the plot and the two selects in one row.
   Phones: the legend, the selects, then the plot. A legend entry is a 44px target: its swatch, its
   short name over its value; switched off, it is struck through and dimmed. */
.goals{display:flex;gap:var(--sp-sm);width:100%;height:100%;min-height:0;align-items:stretch}
.goals.m-stacked{flex-direction:column}
/* A short phone's feed (layout: chart mode 'tickets'): the four goal tickets only; the chart and its controls live in the statistics view. */
.goals.m-tickets{flex-direction:column;justify-content:center}
.goals.m-tickets .ctl,.goals.m-tickets .plot,.goals.m-tickets .grow{display:none}
.goals .legend{display:grid;gap:0;flex:none;align-content:center}
.goals .leg{display:flex;align-items:center;gap:4px;min-height:var(--sz-target);padding:0 var(--sp-sm);text-align:left;
 background:var(--surface);border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--line)}
.goals .leg:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.goals .leg .sw{flex:none;width:10px;height:10px;border-radius:2px}
.goals .leg .tx{display:flex;flex-direction:column;min-width:0;line-height:16px}
.goals .leg .nm{font-weight:var(--fw-bold);white-space:nowrap}
.goals .leg .v{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.goals .leg.off .nm{text-decoration:line-through;color:var(--muted)}
.goals .leg.off .sw{opacity:.3}
.goals .plot{flex:1 1 0;min-width:0;min-height:0;position:relative}
.goals .plot canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.goals .ctl{display:flex;gap:var(--sp-sm);flex:none;align-items:center}
.goals.m-stacked .ctl{order:-1}
.goals.m-stacked .legend{order:-2}
.goals .ctl select{min-height:var(--sz-target);flex:1 1 auto;min-width:0}
.goals .ctl .csel{display:flex;align-items:center;gap:var(--sp-sm);flex:none}
.goals .ctl .csel .w{font-weight:var(--fw-bold);white-space:nowrap}
/* The strip's Enlarge button at its right end, and the enlarged chart's close button. */
.goals .grow,.goals .close,.editor .close{flex:none;width:var(--sz-target);height:var(--sz-target);align-self:center;font-size:var(--fs-lead);font-weight:var(--fw-bold);
 color:var(--accent);background:var(--surface);border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--lineStrong)}
.goals .grow:hover,.goals .close:hover,.editor .close:hover{box-shadow:inset 0 0 0 2px var(--accent)}
/* The enlarged chart: a raised panel over the foot of the room (desktop) or the whole view (phone). */
.chartbig{position:absolute;z-index:4;background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--el-raised),inset 0 0 0 1px var(--lineStrong)}
.goals.m-big{flex-direction:column}
.goals.m-big .legend,.goals.m-big .ctl{order:0}
.goals.m-big .head{display:flex}
.goals.m-big .fullstats{width:auto;height:var(--sz-target);color:var(--accent);margin-left:auto}
.goals.big .ctl{flex-wrap:wrap}
.goals.m-big{display:grid;grid-template-columns:auto 1fr;grid-template-rows:var(--sz-target) 1fr;gap:var(--sp-sm)}
.goals.m-big .plot{grid-column:1 / 3}
/* The top-cats column beside the enlarged plot: four blocks, a heading and a line of three cat names each. */
.goals.m-big .ctl{grid-column:2 / -1}
.goals.m-big .tops{grid-column:3;grid-row:2;display:flex;flex-direction:column;gap:var(--sp-sm);min-width:0}
.goals .tops h3{margin:0;font-size:var(--fs-ui);line-height:var(--lh-ui);font-weight:var(--fw-bold)}
.goals .tops .trow{display:flex;align-items:center;height:var(--sz-target);white-space:pre;color:var(--muted)}
.goals .tops .tcat{border:0;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer;min-height:var(--sz-target);min-width:var(--sz-target)}
.goals .tops .tcat:hover{text-decoration:underline}
/* An editor's two parts stack; on a wide editor (phone landscape's view) they sit side by side. */
.editor .epart{display:flex;flex-direction:column;gap:4px;min-width:0}
.editor.two{flex-direction:row;gap:var(--sp-md)}
.editor.two .epart{flex:1 1 0}
/* The staff-time block: a heading, one bar in two token colours (with the cats, cleaning litter),
   their labels with matching swatches, what is left, and the sentence linking the two editors. */
.editor .staff{display:flex;flex-direction:column;line-height:var(--lh-ui)}
.editor .shead{font-weight:var(--fw-bold)}
.editor .sbar{display:flex;height:8px;margin:1px 0;border-radius:var(--r-pill);background:var(--track);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.editor .sbar .cats{display:block;height:100%;background:var(--staffCats)}
.editor .sbar .litter{display:block;height:100%;background:var(--staffLitter)}
.editor .slabs{display:flex;flex-wrap:wrap;column-gap:var(--sp-sm)}
.editor .slabs span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.editor .slabs span::before{content:"";width:10px;height:10px;border-radius:2px;flex:none}
.editor .slabs .lcats::before{background:var(--staffCats)}
.editor .slabs .llitter::before{background:var(--staffLitter)}
.editor .slabs .lfree::before{background:var(--track);box-shadow:inset 0 0 0 1px var(--lineStrong)}
.editor .visallow{display:flex;flex-direction:column}
.editor .vshort{color:var(--alert);font-weight:var(--fw-bold)}
.editor .snote{margin:0;color:var(--ink)}
/* The editor's header row: its icon, its name, its close button. */
.ehead{display:flex;align-items:center;gap:var(--sp-sm);min-height:var(--sz-target);flex:none}
.ehead .ico{color:var(--accent)}
.ehead .ename{font-size:var(--fs-lead);font-weight:var(--fw-bold);flex:1 1 auto}

/* ---------- the selected-cat readout ---------- */
.readout{display:flex;flex-direction:column;gap:var(--sp-sm);width:100%;height:100%;padding:var(--sp-md) var(--sp-sm);
 background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line),var(--el-card)}
/* The name on its own line, the description wrapped under it: identity text is never cut. */
.readout .ident{display:flex;flex-direction:column;flex:none;overflow:hidden}
.readout .nm{font-size:var(--fs-lead);line-height:var(--lh-lead);font-weight:var(--fw-bold)}
.readout .meta{color:var(--muted)}
.readout.empty .doing{visibility:hidden}
.readout.empty .blocks{display:none}
.readout .doing{display:flex;align-items:center;gap:var(--sp-sm);flex:none;font-weight:var(--fw-bold);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout .doing .dot{flex:none;width:10px;height:10px;border-radius:var(--r-pill)}
.leaders{flex:none;margin-top:auto;display:flex;flex-direction:column}
.leaders h3{margin:0;font-size:var(--fs-ui);line-height:var(--lh-ui);font-weight:var(--fw-bold);color:var(--muted)}
.lrow{display:grid;grid-template-columns:64px repeat(3,minmax(0,1fr)); /* 64px label column, 3px face gap: ASSUMPTION, fitted by eye to "Friendly" at 14px; not in layout-metrics */align-items:center;gap:var(--sp-xs);height:var(--lh-ui);white-space:nowrap}
.lrow .lab{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.lrow .none{grid-column:2 / span 3;color:var(--muted)}
/* Narrow left column (layout leadersLayout 'grid'): a 2 x 2 grid of goal blocks, a heading over three entry lines. */
.leaders.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,auto);gap:var(--sp-sm)}
.leaders.grid .lrow{grid-template-columns:minmax(0,1fr);grid-auto-rows:var(--lh-ui);row-gap:0;height:auto}
.leaders.grid .lrow .none{grid-column:auto}
.leader{display:flex;align-items:center;gap:3px;min-width:0;height:var(--lh-ui);padding:0;border:0;background:none;font:inherit;color:inherit;cursor:pointer;text-align:left}
.leader:hover .nm{text-decoration:underline}
.leader .face{flex:none}
.leader .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.leader .num{flex:none;font-weight:var(--fw-bold);font-variant-numeric:tabular-nums}
.readout .blocks{flex:none}
.blocks{display:flex;flex-wrap:wrap;gap:var(--sp-sm);align-content:flex-start;min-height:0}
.block{min-width:0;overflow:hidden}
.block h3{margin:0;font-size:var(--fs-ui);line-height:var(--lh-ui);font-weight:var(--fw-bold);color:var(--muted)}
.rows{display:grid;gap:0 var(--sp-sm)}

 background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line)}

 font-size:var(--fs-ui);line-height:var(--lh-ui);font-weight:var(--fw-bold);color:var(--muted);
 border-bottom:1px solid var(--line)}
/* The list's height is set to the whole rows that fit (play.js); scrolling snaps a row to its top.
   The scrollbar is thin and low-contrast: the line token on the card. */

.spanel{background:var(--surface);border:1px solid var(--accent);border-radius:var(--r-md);
 padding:var(--sp-md);display:grid;gap:0 var(--sp-sm);align-content:start;overflow:hidden}

 padding:0 var(--sp-xs);border-radius:var(--r-sm);overflow:hidden}

.ttl{margin:0;padding:0 var(--sp-sm);font-size:var(--fs-ui);line-height:var(--lh-ui);
 font-weight:var(--fw-bold);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<div id="app"></div>
<script>
/* The single source of every colour, size, spacing and radius the caregiver UI uses.
   Nothing in the interface hard-codes any of these: the CSS custom properties below are generated from
   this file by build-play.js, and the canvas reads the same object directly, so the painted room and the
   DOM chrome can never drift apart.

   The palette is warm and illustrated (docs/LAYOUT.md section 9): cream paper, oak and fabric in the
   room, real fur on the cats, and a dusty navy for everything the caregiver can press. The accent is
   kept apart from alert red on purpose, so an action never looks like a fight. Contrast is asserted
   rather than eyeballed: contrastReport() checks every text pair against WCAG 2.1 SC 1.4.3 (4.5:1) and
   every graphical pair against SC 1.4.11 (3:1), and `node src/tokens.js` prints the table and exits

// ---------------------------------------------------------------- colour
// Semantic roles only. A component asks for surface or alert, never for a hex value, so the one place a
// colour decision is made is this block.
const color = {
  bg:         '#f6efe3',   // the page behind the cards: cream paper
  surface:    '#fffcf6',   // a card, a panel, a field
  surfaceAlt: '#f8f1e4',   // alternating table rows, an inset well, a tile with nothing to show yet
  ink:        '#2e241d',   // body and data text
  muted:      '#6a5646',   // labels and secondary text
  line:       '#e6d8c3',   // borders and dividers
  lineStrong: '#8d7660',   // an axis, a matrix grid, the edge of a control that must read as a control
  accent:     '#355f86',   // interactive accent, the selected state, the focus ring
  accentInk:  '#ffffff',   // text on the accent
  accentSoft: '#e3ebf3',   // the fill behind a selected row or an open disclosure
  // The room's door green, which the timeline uses for the next meal or clean.
  open:       '#335d2e',
  // The staff-time bar in the Visitors and Litter editors: time with the cats (green) and litter
  // rounds (amber), two hues apart in lightness too.
  staffCats:  '#3d7a3a',
  staffLitter: '#c4501f',
  header:     '#4a3a2e',   // the clock and transport strip that heads the left column
  headerInk:  '#fff6ea',   // text and controls on the header strip
  track:      '#efe3d0',   // the empty part of a bar, so a low value still reads as a value
  need:       '#a8661f',   // a need bar: honey
  trait:      '#557848',   // a personality bar: sage
  good:       '#43703e',   // calm, inside budget
  goodSoft:   '#e5efdc',
  warn:       '#a3400f',   // caution, at the edge of a budget, a need running high
  warnSoft:   '#fbe6d8',
  alert:      '#b02a22',   // stress, a fight, over budget
  alertSoft:  '#fbe1dc',
  scrim:      'rgba(46, 36, 29, 0.45)',
};

// The room itself: oak planks in the main room and a woven sage rug in the quiet room, so the two rooms
// are told apart by their floors before anything is read.
const room = {
  floor:      '#e8cfa6',   // oak plank
  floorGrain: '#dec396',   // the alternate plank and the grain drawn along it
  seam:       '#b89366',   // the joint between planks
  rug:        '#d9e1cb',   // the quiet room's woven rug
  rugWeave:   '#b9c7a3',
  rugEdge:    '#5f7a4d',   // the rug's bound edge and stitching
  wall:       '#6b4f3a',
  wallInk:    '#4a3528',   // fixed obstacles and the room names
  light:      '#fff8e6',   // the patch of daylight a window throws on the floor
  shadow:     'rgba(60, 40, 20, 0.16)',
  // Staff and visitors share one figure; what tells staff apart is what they carry (a food scoop, a
  // litter scoop, the vacuum), drawn in propInk.
  propInk:    '#2b2118',
  doorOpen:   '#335d2e',
  doorShut:   '#9c231b',
  tooltipBg:  '#3a2c22',
  tooltipInk: '#fff6ea',
};

// Furniture, by what the object is. Each sprite is drawn from a body, an edge, one content colour and
// one detail colour; every object has its own silhouette first and its own colour second.
const object = {
  bowl:    { body: '#c4573c', edge: '#5a4030', content: '#8a5a32', detail: '#f4ead8' },   // coral bowl, kibble
  water:   { body: '#33658a', edge: '#5a4030', content: '#4f8fb0', detail: '#ffffff' },   // steel-blue bowl, water
  litter:  { body: '#8b8f7a', edge: '#5a4030', content: '#ece0c6', detail: '#8b8f7a' },   // tray, sand
  bed:     { body: '#7f9f74', edge: '#5a4030', content: '#e9e0c9', detail: '#5a4030' },   // sage cushion
  perch:   { body: '#c9b08a', edge: '#5a4030', content: '#9c7a59', detail: '#d8bf8c' },   // carpeted cat tree
  hide:    { body: '#c6955b', edge: '#5a4030', content: '#3a2a1e', detail: '#7d5530' },   // cardboard box
  scratch: { body: '#d8bf8c', edge: '#5a4030', content: '#8a6b3c', detail: '#c9b08a' },   // sisal post
  window:  { body: '#cfe7f0', edge: '#5a4030', content: '#ffffff', detail: '#fff8e6' },
  bench:   { body: '#9c7a59', edge: '#5a4030', content: '#b8966f', detail: '#5a4030' },   // a wooden bench, slatted
  toy:     { body: '#d39a3a', edge: '#5a4030', content: '#f1cf8a', detail: '#5a4030' },   // a ball of yarn
};

// What a cat is doing, as one colour per activity family: the fill of the badge over the cat and the
// halo under it. Each clears 3:1 against both floors, and the glyph clears 4.5:1 on each.
const activity = {
  rest:   '#4a5870',
  need:   '#335d2e',
  solo:   '#663c8c',
  friend: '#1d626b',
  host:   '#9c231b',
  flee:   '#24569a',
};

// Coats: real shelter fur. `pattern` says how base and mark are laid out on the body, so a tabby has
// stripes, a tuxedo a white bib, a colourpoint dark ears and face, and a solid cat none of these. A
// colourpoint's `rump` is the shading toward its tail, an opaque mix of base and mark (no cat is drawn
// with transparency).
const coat = {
  'white':         { base: '#fbf8f3', pattern: 'solid' },
  'orange-tabby':  { base: '#e39a52', mark: '#b4662a', pattern: 'tabby' },
  'black':         { base: '#2e2a28', pattern: 'solid' },
  'grey-tabby':    { base: '#9c9b98', mark: '#62615e', pattern: 'tabby' },
  'tuxedo':        { base: '#2e2a28', mark: '#fbf8f3', pattern: 'bib' },
  'calico':        { base: '#fbf8f3', mark: '#e39a52', mark2: '#2e2a28', pattern: 'patches' },
  'silver-tabby':  { base: '#d3d3cf', mark: '#6f706c', pattern: 'tabby' },
  'grey':          { base: '#8f9298', pattern: 'solid' },
  'white-orange':  { base: '#fbf8f3', mark: '#e39a52', pattern: 'patches' },
  'dilute-tortie': { base: '#8f8a8a', mark: '#e3c39a', mark2: '#a9a19c', pattern: 'patches' },
  'cream':         { base: '#f0dcb8', mark: '#d9b98a', pattern: 'tabby' },
  'black-white':   { base: '#fbf8f3', mark: '#2e2a28', pattern: 'patches' },
  'lilac-point':   { base: '#efe8e2', mark: '#9d919e', rump: '#cac1c3', pattern: 'point' },
  'blue-tabby':    { base: '#8e949c', mark: '#5e646c', pattern: 'tabby' },
  'brown-tabby':   { base: '#a2825f', mark: '#5f4630', pattern: 'tabby' },
  'chocolate':     { base: '#7a5641', pattern: 'solid' },
  'tortie':        { base: '#3a2c25', mark: '#c8763a', mark2: '#8a5a32', pattern: 'patches' },
  'seal-point':    { base: '#efe4d2', mark: '#5a4334', rump: '#ac9c8b', pattern: 'point' },
};
// The ink a cat is drawn with: its outline, its ground shadow, the line of a closed eye (dark on a pale
// coat, pale on a dark one) and the eye colour used when a cat carries none of its own.
const cat = { edge: '#6b4f3a', shadow: 'rgba(60, 40, 20, 0.18)', lid: '#2e241d', lidOnDark: '#e8dcc8', eye: '#c9a43a' };

// One line per cat on a chart: eight hues chosen to be told apart from each other, each at least 3:1 on
// the card, and a dash pattern that cycles once the hues run out, so cat 9 is cat 1's hue dashed rather
// than a ninth hue too close to one of the first eight. The shelter aggregate is ink and the only thick
// line. The resident cat has a line of his own rather than the next free one.
const series = ['#2f64a8', '#c4501f', '#3d7a3a', '#7a4fa0', '#9a6a00', '#1f7f86', '#a33c78', '#7a5230'];
const seriesDash = [[], [7, 4]];
// The four shelter goals on the goals chart: the first four series hues, told apart by dash and end
// shape too (play.js GOALS), so no reader needs the colour alone.
const goalSeries = { stress: series[0], conflict: series[1], friendly: series[2], hiding: series[3] };
const residentLine = { color: '#4a5870', dash: [2, 3] };

// ---------------------------------------------------------------- type
// 14px is the base (docs/LAYOUT.md settled decision 5); nothing in the interface is smaller.
const font = {
  stack: '"Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif',
  size: { ui: 14, prose: 15, lead: 16, value: 22, display: 28 },
  line: { ui: 21, prose: 24, lead: 24, value: 28 },
  weight: { normal: 400, medium: 600, bold: 700 },
};

// ---------------------------------------------------------------- space
// The same scale the solver reserves with, so a padding in the CSS and a padding in a solved rectangle
// are the same number by construction.
const space = { xs: 4, sm: 8, md: 12, lg: 16, xl: 24 };
const size = { target: 44, bar: 56, card: 56, icon: 18, iconSmall: 12, logHeader: 24, logPad: 4, barTrack: 7, catScale: 1.35 };
// Cats are drawn 1.35 times true scale: at true scale a cat is about 30 px long at 1280 x 800, too small
// to show a coat. Drawing only: the cat's position and size in the simulation are unchanged.
const radius = { sm: 4, md: 8, lg: 12, pill: 999 };
const elevation = {
  flat: 'none',
  card: '0 1px 2px rgba(46, 36, 29, 0.07)',
  raised: '0 4px 14px rgba(46, 36, 29, 0.14)',
};
const motion = { fast: '120ms', normal: '200ms' };

// ---------------------------------------------------------------- contrast
const srgb = hex => {
  const h = hex.replace('#', '');
  const n = h.length === 3 ? [...h].map(c => c + c).join('') : h;

const lum = hex => { const [r, g, b] = srgb(hex).map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };

// Every pair the interface actually puts together, with the rule each one answers to.
const CONTRAST_PAIRS = [];
const pair = (what, fg, bg, min) => CONTRAST_PAIRS.push([what, fg, bg, min]);
for (const [where, bg] of [['a card', color.surface], ['the page', color.bg], ['an alternating row', color.surfaceAlt]]) {
  pair('body text on ' + where, color.ink, bg, 4.5);
  pair('a label on ' + where, color.muted, bg, 4.5);
  pair('accent text on ' + where, color.accent, bg, 4.5);
}
pair('text on the accent', color.accentInk, color.accent, 4.5);
pair('text on a selected row', color.ink, color.accentSoft, 4.5);
pair('accent text on a selected row', color.accent, color.accentSoft, 4.5);
pair('text on the header strip', color.headerInk, color.header, 4.5);
// The three kinds of control on the header strip (play-template.html): a primary face and its pressed
// tint must stand off the strip, a secondary outline must read as an edge, and a pressed face carries
// its ring, its icon and, on a budget card, a value in its budget colour.
pair('a primary face against the header strip', color.surface, color.header, 3);
pair('a pressed primary face against the header strip', color.accentSoft, color.header, 3);
// Pause is the one solid accent face; it is dark on the dark strip, so it carries a ring in the strip's
// ink that is what separates it from the strip.
pair('text and icon on the pause face', color.accentInk, color.accent, 4.5);
pair('the ring of the pause face against it', color.headerInk, color.accent, 3);
// A plan card's disclosure triangle, closed on the cream face and open on its pressed tint.
pair('the triangle on a plan card', color.accent, color.surface, 3);
pair('the staff bar: time with the cats, on an editor', color.staffCats, color.accentSoft, 3);
pair('the staff bar: litter rounds, on an editor', color.staffLitter, color.accentSoft, 3);
pair('the triangle on an open plan card', color.accent, color.accentSoft, 3);
// The timelines (play.js drawTimeline): marks on the strip's track, the served meal, the next meal,
// the visiting hours' edge and the notch for now.
pair('a timeline mark on its track', color.accent, color.track, 3);
pair('the next meal on the timeline track', color.open, color.track, 3);
pair('the visiting-hours edge on the timeline track', color.lineStrong, color.track, 3);
pair('the now notch on the timeline track', color.ink, color.track, 3);
pair('timeline labels on an open editor', color.muted, color.accentSoft, 4.5);
// The shelter goals: a goal card's edge against the page, and the selected period.
pair('a goal card edge against the page', color.lineStrong, color.bg, 3);
pair('the selected period on the goals switch', color.accentInk, color.accent, 4.5);
pair('the goals label on the page', color.accent, color.bg, 4.5);
pair('the Yes of the Restart confirmation', color.accentInk, color.alert, 4.5);
pair('the ring of a pressed face', color.accent, color.accentSoft, 3);
pair('the icon on a primary face', color.accent, color.surface, 3);
pair('a secondary outline on the header strip', color.headerInk, color.header, 3);
pair('text on a hovered secondary control', color.header, color.headerInk, 4.5);
for (const k of ['good', 'alert']) pair(k + ' on a pressed budget card', color[k], color.accentSoft, 4.5);
for (const k of ['good', 'warn', 'alert']) { pair(k + ' on a card', color[k], color.surface, 4.5); pair(k + ' on its own tint', color[k], color[k + 'Soft'], 4.5); }
pair('tooltip text', room.tooltipInk, room.tooltipBg, 4.5);
// What a staff member carries must stand off the floor and the rug they walk on.
pair('a carried prop on the floor', room.propInk, room.floor, 3); pair('a carried prop on the rug', room.propInk, room.rug, 3);
pair('a card edge against the page', color.line, color.bg, 1.2);
pair('an axis against a card', color.lineStrong, color.surface, 3);
pair('the focus ring against a card', color.accent, color.surface, 3);
for (const k of ['need', 'trait', 'warn', 'alert', 'good']) { pair('a ' + k + ' bar on its track', color[k], color.track, 3); pair('a ' + k + ' bar on a card', color[k], color.surface, 3); }
for (const [where, floor] of [['the oak floor', room.floorGrain], ['the rug', room.rugWeave]]) {
  pair('a room name on ' + where, room.wallInk, floor, 4.5);
  pair('a wall against ' + where, room.wall, floor, 3);
  pair('an open door against ' + where, room.doorOpen, floor, 3);
  pair('a shut door against ' + where, room.doorShut, floor, 3);
  for (const [k, v] of Object.entries(activity)) pair('a ' + k + ' badge against ' + where, v, floor, 3);
  for (const [k, v] of Object.entries(object)) pair('the edge of the ' + k + ' sprite against ' + where, v.edge, floor, 3);

}

pair('a room name on its backing', room.wallInk, color.surface, 4.5);
for (const [k, v] of Object.entries(activity)) pair('the glyph on a ' + k + ' badge', room.tooltipInk, v, 4.5);
for (let i = 0; i < series.length; i++) pair('series line ' + (i + 1) + ' on a card', series[i], color.surface, 3);
for (const [k, c] of Object.entries(goalSeries)) pair('goals chart line: ' + k + ' on the plot', c, color.surface, 3);
pair("the resident cat's line on a card", residentLine.color, color.surface, 3);

function contrastReport() {
  return CONTRAST_PAIRS.map(([what, fg, bg, min]) => {
    const ratio = contrast(fg, bg);
    return { what, fg, bg, min, ratio, pass: ratio >= min };
  });
}

// ---------------------------------------------------------------- css
// The custom properties the stylesheet reads. Generated, never hand-written, so adding a token here is
// the only way one reaches the CSS.
function cssVars() {

// to the view rectangle, so the tiling stays exact and no spacer rectangle exists.
const FRAME = { desktop: 2 * GAP, phone: GAP };
// The left column on desktop: one readout detail column and its padding. The readout, an open editor
// and the event log stack in it; everything the caregiver presses is in the top bar.
// The readout is padded PAD top and bottom but only GAP at its sides: a detail column is already
// inset by its own label and value, and the 8 px it saves lets the longest description sit on one line
// in the 361 px column at 1366 x 768, which is what makes room for the affinity block there.
const READOUT_PAD_X = GAP;
const LEFT_W = px(READOUT_COL_W + 2 * READOUT_PAD_X);
// Where the room is height-bound the band beside it has width the room cannot use; the left column
// takes it, up to the width of a two-column readout, so the readout and the log stop wrapping.
const LEFT_MAX_W = px(2 * READOUT_COL_W + GAP + 2 * READOUT_PAD_X);
// The eight needs the readout draws. Measured as a list by layout-metrics.js, so a need cannot be added
// to the readout without the solver re-sizing the block that holds it.
const NEED_LABELS = METRICS.needs;
// The shelter goals chart, in the live feed's footprint: one plot of four series over time (average
// stress, conflict, friendly contact, hiding), each on its own fixed or span-relative scale; a legend
// that is also the readout and toggles its series; a span select and a bucket-size select. Heights are
// the feed's: one row of FEED_VALUES_H on desktop, three on a phone.
const GOAL_IDS = ['stress', 'conflict', 'friendly', 'hiding'];
const FEED_VALUES_H = px(LINE + (FS.lead + 12) + 2 * GAP);     // 65: the live feed's row
// A legend entry is a 44px target: a 10px swatch, then its short name over its value at 14px.
const CHART_LEG_W = px(14 + Math.max(TX('legName'), TX('legValue')) + 2 * GAP);
// A select: its widest option and the native arrow (24px), padded.
// A select cell: its visible word ("Show", "Per"), a gap, then the select sized to its longest option.
const CHART_SEL_W = px(Math.max(TX('showWord'), TX('perWord')) + GAP + Math.max(TX('spanLabel'), TX('grainLabel')) + 24 + 2 * GAP);
// The plot's floor: it has to show a line, a few time ticks and the now edge. Our own judgement.
const CHART_PLOT_MIN = { w: 160, h: 40 };
// Stacked, the two labelled selects and the Enlarge button share one row.
const CHART_CTL_ROW_W = 2 * CHART_SEL_W + TARGET + 2 * GAP;
const TICK_H = 17;
// One row (desktop): legend entries abreast, the plot, the two selects, side by side in one 65px row.
// Stacked (phones): the legend on a row (two rows where four entries do not fit abreast), the selects
// on a row, the plot under them.
// The strip ends in an Enlarge button (a 44px target) at its right.
function chartLayout(w, h) {
  const rowW = 4 * CHART_LEG_W + 2 * CHART_SEL_W + TARGET + 4 * GAP;
  if (h < 2 * TARGET + CHART_PLOT_MIN.h) {
    const plot = { w: w - rowW, h };
    return { mode: 'row', legendCols: 4, legendRows: 1, plot, fits: plot.w >= CHART_PLOT_MIN.w && plot.h >= CHART_PLOT_MIN.h };
  }
  const legendCols = w >= 4 * CHART_LEG_W ? 4 : 2, legendRows = 4 / legendCols;
  // Stacked, the Enlarge button sits on the selects' row; the plot takes the rest.
  const plot = { w, h: h - legendRows * TARGET - TARGET - 2 * GAP };
  return { mode: 'stacked', legendCols, legendRows, plot, fits: plot.w >= CHART_PLOT_MIN.w && plot.h >= CHART_PLOT_MIN.h && w >= CHART_CTL_ROW_W };
}
// The band's height is the live feed's: one row where the one-row chart fits, three otherwise.
const feedHeight = w => (w >= 4 * CHART_LEG_W + 2 * CHART_SEL_W + TARGET + 4 * GAP + CHART_PLOT_MIN.w ? 1 : 3) * FEED_VALUES_H;
// The enlarged chart on desktop: a panel over the foot of the room, inside the room's view, the view's
// width less its frame. Its header row holds the legend, the selects, "Open full stats" and the close
// button; under it a plot of CHART_BIG_PLOT_H and its time ticks. The room does not resize.
const CHART_BIG_PLOT_H = 270;   // 240 before the top-cats column; its four blocks of 44px name targets set it now
// Beside the enlarged plot (desktop), a column with the three top cats for each goal over the span.
const CHART_TOP_W = px(Math.max(TX('topHead'), TX('topLine')) + 2 * GAP);
const CHART_TOP_BLOCK_H = LINE + TARGET;   // a heading, and one row of three cat names, each a 44px target
const CHART_BIG_H = TARGET + GAP + CHART_BIG_PLOT_H + TICK_H + 2 * PAD;
function chartBigIn(view, frame) { const h = CHART_BIG_H; return { x: view.x + frame, y: view.y + view.h - frame - h, w: view.w - 2 * frame, h }; }

// The top-cats slot: four goals, three cats each, a face, the name and the value per cat, in 21px text lines (LINE).
// Wide (a 64px label column and three entries of 96px in a row): one line per goal. Narrow: a 2 x 2 grid of goal
// blocks, each a heading line over three entry lines. LEADERS_LABEL_W and LEADERS_ENTRY_W: ASSUMPTION, fitted by eye to
// "Friendly" and to a face, a seven-letter name and a value at 14px; not measured by layout-metrics.js.
const LEADERS_LABEL_W = 64, LEADERS_ENTRY_W = 96;
function leadersLayout(w) {
  return w >= LEADERS_LABEL_W + 3 * LEADERS_ENTRY_W ? { mode: 'rows', h: 4 * LINE } : { mode: 'grid', h: 2 * 4 * LINE + GAP };
}
// ---------------------------------------------------------------- content model
const textRows = (textW, innerW) => Math.max(1, Math.ceil(textW / Math.max(1, innerW)));
const stretch = r => ({ w: r.w, h: r.h, stretch: true });

const CONTENT = {
  // One detail column: its label, a bar at one pixel per percent, and the value printed after the bar.
  // Declared once, because the left column's minimum width is "wide enough for two of these" and the two
  // must not be allowed to drift apart.
  // One detail column: its label, a bar, and the value printed after the bar, inside the committed
  // READOUT_COL_W. The label and the value are measured strings and cannot move; the bar takes what is
  // left, and readoutBarW asserts that what is left is still a bar.
  readoutColW: () => READOUT_COL_W,
  readoutLabelW: () => px(Math.max(TX('needLabel'), TX('traitLabel'), TX('affRow'))),
  readoutValueW: () => px(TX('needValue')),
  readoutBarW: () => READOUT_COL_W - CONTENT.readoutLabelW() - GAP - GAP - CONTENT.readoutValueW(),
  logRows: (w, st) => textRows(TX('logLine') * st.labelScale, w - 2 * LOG_PAD - TX('logTime') - GAP),
  logHeightFor: (w, st, msgs) => LOG_HEADER + msgs * CONTENT.logRows(w, st) * LINE + 2 * LOG_PAD,
  logMessagesIn: (w, h, st) => Math.floor((h - LOG_HEADER - 2 * LOG_PAD) / (CONTENT.logRows(w, st) * LINE)),

  // A schedule editor, in main's place. At its top: the plan in full with its times, the budget bar
  // with "50 of 50 min used" where the plan has a budget, and the timeline with its hour labels.
  // Under them, main's fields.
  // An editor in two parts. The top: a header row (the control's icon, its name, a close button), the
  // plan in full, then what limits it: the shared "Staff time today" block for Visitors and Litter
  // cleaning (heading, a split bar, its two labelled parts and what is left, and the sentence tying the
  // two editors together), or the allowance line for Vacuum. The rest: the timeline, its two-line
  // legend, and the fields. Wrapped at word breaks a line holds less than its measured width, so
  // wrapped text gets 20% slack.
  editorTop: (w, id) => {
    const inner = w - 2 * PAD, wrap = (t, iw) => textRows(TX(t) * 1.2, iw) * LINE;
    const staff = id === 'visitors' || id === 'cleaning'
      // The bar's two labels share a line where both fit with their swatches; "Left: N min" has a line.
      ? textRows(TX('staffHead'), inner) * LINE + STAFF_BAR_H
        // the labels: with the cats, cleaning litter and unused, abreast where they fit
        + (id === 'visitors' ? 1 : inner >= TX('staffCats') + TX('staffLitter') + TX('staffUnused') + 3 * 14 + 3 * GAP ? 1 : inner >= TX('staffCats') + TX('staffLitter') + 2 * 14 + 2 * GAP ? 2 : 3) * LINE
        // Litter: the sentence. Visitors: the time for visits, its used-against-free bar and line, the
        // shortened note, and the free-split sentence.
        + (id === 'cleaning' ? wrap('staffNote', inner)
          // the shortened note takes the free-split sentence's place while the visits are shortened
          : LINE + STAFF_BAR_H + wrap('visUsed', inner) + Math.max(wrap('visSplit', inner), wrap('visShort', inner))) + EDITOR_GAP
      : id === 'vacuum' ? wrap('allowance', inner - 48) + EDITOR_GAP : 0;
    // The Visitors editor's plan is its "Used" line, so it has no plan line of its own.
    return TARGET + EDITOR_GAP + (id === 'visitors' ? 0 : textRows(TX('planFeeding'), inner) * LINE + EDITOR_GAP) + staff;
  },
  editorRest: (w, id) => TIMELINE_BIG_H + 2 * textRows(TX('legend'), w - 2 * PAD) * LINE + EDITOR_GAP + CONTENT.editorFields(w, id),
  // Wide (phone landscape's editor view) the two parts sit side by side.
  editorTwoCol: w => w >= EDITOR_TWO_COL_W,
  editorHead: (w, id) => CONTENT.editorTop(w, id) + TIMELINE_BIG_H + 2 * textRows(TX('legend'), w - 2 * PAD) * LINE + EDITOR_GAP,
  editor: (w, id) => CONTENT.editorTwoCol(w)
    ? Math.max(CONTENT.editorTop(w / 2, id), CONTENT.editorRest(w / 2, id))
    : CONTENT.editorTop(w, id) + CONTENT.editorRest(w, id),
  editorFields: (w, id) => {
    const inner = w - 2 * PAD;
    if (id === 'feeding' || id === 'cleaning') {                          // meals a day, then a time field per meal, up to six
      // A time field is a native control, measured as one (timeField): its box holds the hours, the
      // minutes, the day-period field of a 12-hour locale and the picker icon, not just "08:00". Sized
      // from the text alone it was 53px and clipped its own value.
      const fieldW = px(TIME_FIELD_W + GAP);
      const perRow = Math.max(1, Math.floor((inner + GAP) / fieldW));
      // Feeding: meals a day; Litter cleaning: cleans a day. Each then a time field per entry, up to six.
      return TARGET + GAP + Math.ceil(6 / perRow) * (TARGET + GAP) - GAP + 2 * PAD;
    }
    // Label, number field, gap. The number field is sized the same way the time field is: the widest
    // string it has to hold, padded by EDITOR_FIELD_PAD. "08:00" is five characters and every number
    // these editors take is at most three digits, so the time measurement bounds the number field and
    // there is no second string to measure. That is 188px per field, so two fit abreast in the 402px
    // column and the three settings are two rows rather than three single-field ones.
    const fieldW = px(TX('editorField') + GAP + px(TX('editorTime') + 2 * EDITOR_FIELD_PAD) + GAP);
    const perRow = Math.max(1, Math.floor((inner + GAP) / fieldW));
    // The hours: "Between [10]:00 and [19]:00", one row where it fits, the two halves stacked where not.
    const half = px(TX('editorBetween') + 4 + px(TX('editorTime') + 2 * EDITOR_FIELD_PAD) + 4 + TX('editorHourSuffix'));
    const windowRows = inner >= 2 * half + GAP ? 1 : 2;
    return (Math.ceil(2 / perRow) + windowRows) * (TARGET + GAP) - GAP + 2 * PAD;
  },

  // The selected-cat readout. Identity and the written activity are the required core; the three detail
  // blocks are columns of labelled bars, laid side by side when the width allows.
  // The cat's name, then its description on as many lines as the column needs: core identity text is
  // wrapped, never cut with an ellipsis.
  // The row pitch of each detail block, declared once for the solver and the drawn readout. A needs
  // row is a line plus 1 px so its bar clears the next label; the other two blocks are tighter lists.
  readoutRowH: { needs: LINE + 1, personality: LINE - 1, affinity: LINE },
  readoutIdentH: (w) => FS.lead + 6 + textRows(TX('catMeta'), w - 2 * READOUT_PAD_X) * LINE,
  readoutBlocks: (w) => {
    const inner = w - 2 * READOUT_PAD_X;
    // A detail row is its label, a bar at one pixel per percent, and the value printed after the bar.
    // The widest value any of the three blocks prints is the Cat-Stress-Score, because stress is read as
    // CSS here exactly as it is in the live feed. One column width serves all three blocks, which
    // overcounts the needs label by the few pixels "Extraverted" is wider than "Sleepiness"; one rule is
    // worth more than those pixels.
    const colW = CONTENT.readoutColW();
    const perRow = Math.max(1, Math.min(3, Math.floor((inner + GAP) / (colW + GAP))));
    const nameRow = CONTENT.readoutIdentH(w);
    const activityRows = textRows(TX('catActivity'), inner) * LINE;
    // All eight needs are drawn. The needs block spans the whole readout and lays them across `perRow`
    // sub-columns: eight bars stacked in one narrow column would cost more height than the personality
    // and affinity blocks that would otherwise sit beside it are worth.
    return { colW, perRow, needs: NEED_LABELS.length, core: nameRow + activityRows + 2 * GAP + 2 * PAD,   // ident, gap, activity, gap, then the blocks
      blocks: [{ id: 'needs', span: perRow, h: LINE + Math.ceil(NEED_LABELS.length / perRow) * CONTENT.readoutRowH.needs },
        { id: 'personality', span: 1, h: LINE + 5 * CONTENT.readoutRowH.personality },
        { id: 'affinity', span: 1, h: LINE + 4 * CONTENT.readoutRowH.affinity }] };
  },
  // Packs the blocks into rows of `perRow` column slots, honouring each block's span.
  readoutHeight: (w, blocks) => {
    const b = CONTENT.readoutBlocks(w);
    let h = b.core, row = [], used = 0;
    for (const blk of blocks) {
      const span = Math.min(blk.span || 1, b.perRow);
      if (used && used + span > b.perRow) { h += Math.max(...row.map(x => x.h)) + GAP; row = []; used = 0; }
      row.push(blk); used += span;
    }
    if (row.length) h += Math.max(...row.map(x => x.h)) + GAP;
    return h;
  },
  // Which blocks a rectangle of height h can hold, in priority order. The core is always required, so a
  // narrow or short form says exactly what it gives up rather than silently truncating.
  // Which blocks a rectangle of height h can hold, in priority order. The identity core and the eight
  // needs are required: the needs are the reason a caregiver taps a cat at all, so a rectangle that
  // cannot hold them is a failure to report, not a readout to quietly truncate. Personality and affinity
  // are the detail blocks that give way, and the solver names which one it dropped.
  readoutFit: (w, h) => {
    const b = CONTENT.readoutBlocks(w);
    const required = b.blocks.slice(0, 1), optional = b.blocks.slice(1);
    const shown = required.slice();
    for (const blk of optional) if (CONTENT.readoutHeight(w, shown.concat([blk])) <= h) shown.push(blk);
    const need = CONTENT.readoutHeight(w, required);
    return { core: b.core, perRow: b.perRow, needsH: required[0].h, required: need,
      used: Math.max(need, CONTENT.readoutHeight(w, shown)),
      shown: shown.map(x => x.id), full: shown.length === b.blocks.length, fits: need <= h };
  },
  statsMinH: () => TARGET + GAP + CHART_MIN_H + 2 * PAD,
  // The Controls view's grid: a cell holds a chip's long line.
  cardCols: (w) => Math.max(1, Math.floor((w + GAP) / (CARD_CHIP_LONG_W + GAP))),
  chipCols: (w) => Math.max(1, Math.min(3, Math.floor((w + GAP) / (CARD_CHIP_W + GAP)))),
  // What a phone's view rectangle has to hold for a given view.
  viewNeed: (w, h, view, st) => {
    if (view === 'room') return px((w - 2 * FRAME.phone) / ASPECT) + 2 * FRAME.phone;
    if (view === 'stats' || view === 'guide') return h;          // a full-screen mode uses what it is given
    if (view === 'controls') return Math.ceil(CONTROL_CARDS.length / CONTENT.cardCols(w)) * CARD_H;
    if (view === 'chart') return h;                              // the enlarged goals chart takes the view
    return px(CONTENT.editor(w, view));                          // an editor carries its own header row
  },
};

// ---------------------------------------------------------------- geometry
class Shortfall extends Error {
  constructor(what, need, got) { super(`${what}: need ${need}px, have ${got}px (short ${need - got}px)`); this.what = what; this.need = need; this.got = got; this.short = need - got; }
}
const R = (id, x, y, w, h) => ({ id, x: px(x), y: px(y), w: px(w), h: px(h) });
// Split a box into columns. Cells with `w: null` share the remainder equally; the last of them takes the
// rounding, so the row ends exactly on the box edge.
function cols(box, spec) {
  const fixed = spec.filter(s => s.w != null).reduce((a, s) => a + s.w, 0);
  const flex = spec.map((s, i) => s.w == null ? i : -1).filter(i => i >= 0);
  const share = flex.length ? Math.floor((box.w - fixed) / flex.length) : 0;
  const widths = spec.map(s => s.w == null ? share : s.w);
  if (flex.length) widths[flex[flex.length - 1]] += box.w - fixed - share * flex.length;
  let x = box.x; const out = [];
  spec.forEach((sp, i) => { out.push(R(sp.id, x, box.y, widths[i], box.h)); x += widths[i]; });
  return out;
}
function rows(box, spec) {
  const fixed = spec.filter(s => s.h != null).reduce((a, s) => a + s.h, 0);
  if (spec.filter(s => s.h == null).length > 1) throw new Error('at most one flexible row');
  let y = box.y; const out = [];
  for (const s of spec) { const h = s.h == null ? box.h - fixed : s.h; out.push(R(s.id, box.x, y, box.w, h)); y += h; }
  return out;
}

// The control cards, in a grid, with an open editor inserted directly under the row of the card it
// belongs to. That is what "the card expands in place" means: the editor is attached to its own control,
// and only the cards below it move down.
function cardStack(box, nCols, open) {
  const out = [];
  const rowsOf = [];
  for (let i = 0; i < CARDS.length; i += nCols) rowsOf.push(CARDS.slice(i, i + nCols));
  let y = box.y;
  rowsOf.forEach(ids => {
    out.push(...cols({ x: box.x, y, w: box.w, h: CARD_H }, ids.map(id => ({ id }))));
    y += CARD_H;
    // Every editor open on a card in this row appears directly under it, in card order.
    for (const id of ids) {
      const ed = EDITABLE[id];
      if (ed && open.includes(ed)) { const h = px(CONTENT.editor(box.w, ed)); out.push(R('editor-' + ed, box.x, y, box.w, h)); y += h; }
    }
  });
  return { rects: out, height: y - box.y };
}

// ---------------------------------------------------------------- layout engines
// The canvas a view rectangle holds: the largest 1.625 rectangle inside the view less its frame,
// centred. One function, used by the engines, the solver's assertions and the running room.
function canvasIn(view, frame) {
  const w = Math.min(view.w - 2 * frame, px((view.h - 2 * frame) * ASPECT)), h = px(w / ASPECT);
  return { x: view.x + px((view.w - w) / 2), y: view.y + px((view.h - h) / 2), w, h };
}
// The largest framed room for a band of the given size: its width and height including the frame.
function framedRoom(maxW, maxH, frame) {
  const w = Math.floor(Math.min(maxW - 2 * frame, (maxH - 2 * frame) * ASPECT));
  return { w, h: px(w / ASPECT), outerH: px(w / ASPECT) + 2 * frame };
}

// Desktop (layout revision 4, main's layout). One top bar carries every control; a narrow left column
// carries the cat readout, an open schedule editor and the event log; the room is centred in a frame
// and is the dominant region; the shelter goals strip runs under it in main's footprint.
//   The bar: the clock, Play/Pause, speed; the four plan chips as one group; then Restart (an icon),
//   Show stats and How to play as links in the corner.
function desktop(W, H, st) {
  const F = FRAME.desktop;
  // ---- the top bar. Fixed cells at their minimums; spare width goes first to Play/Pause's word, then
  // to the chips' unabbreviated line, then to the speed track up to its cap, and the rest to the
  // chips.
  const fixed = { clock: CLOCK_W, 'btn-guide': GUIDE_W };
  const fixedW = Object.values(fixed).reduce((a, x) => a + x, 0);
  const minW = fixedW + TOGGLE_SHORT_W + RESTART_W + PAUSE_ICON_W + SPEED_W + PLAN_CARDS.length * CARD_CHIP_W;
  if (minW > W) throw new Shortfall('desktop top bar', minW, W);
  let spare = W - minW;
  // Spare width buys, in order: Restart's word, Play/Pause's word, the toggle's long
  // label ("Show stats"), the chips' long line, then the speed track.
  const buy = w => { if (spare < w) return false; spare -= w; return true; };
  const restartWord = buy(RESTART_WORD_W - RESTART_W);
  const pauseLabel = buy(PAUSE_W - PAUSE_ICON_W);
  const toggleLong = buy(TOGGLE_MIN_W - TOGGLE_SHORT_W);
  const chipLong = spare >= PLAN_CARDS.length * (CARD_CHIP_LONG_W - CARD_CHIP_W);
  let chipW = chipLong ? CARD_CHIP_LONG_W : CARD_CHIP_W; if (chipLong) spare -= PLAN_CARDS.length * (CARD_CHIP_LONG_W - CARD_CHIP_W);
  const speedW = Math.min(SPEED_MAX_W, SPEED_W + spare); spare -= speedW - SPEED_W;
  const share = Math.floor(spare / PLAN_CARDS.length);
  const widths = { ...fixed, 'toggle-view': toggleLong ? TOGGLE_MIN_W : TOGGLE_SHORT_W, restart: restartWord ? RESTART_WORD_W : RESTART_W, pause: pauseLabel ? PAUSE_W : PAUSE_ICON_W, speed: speedW };
  for (const id of PLAN_CARDS) widths[id] = chipW + share;
  widths[PLAN_CARDS[PLAN_CARDS.length - 1]] += spare - share * PLAN_CARDS.length;
  const out = cols({ x: 0, y: 0, w: W, h: BAR_H },
    ['clock', 'pause', 'speed', ...PLAN_CARDS, 'restart', 'toggle-view', 'btn-guide'].map(id => ({ id, w: widths[id] })));

  // ---- the room band: the framed room over the goals strip.
  const bodyH = H - BAR_H, band0 = W - LEFT_W;
  const strip = bw => feedHeight(bw - 2 * F) + F;
  const room = framedRoom(band0, bodyH - strip(band0), F);
  if (room.w < CANVAS_MIN_W.desktop) throw new Shortfall('room canvas width', CANVAS_MIN_W.desktop, room.w);
  // The room is now fixed. Width it cannot use goes to the left column, as long as the strip under
  // the room still fits its height at the narrower band.
  let leftW = Math.min(LEFT_MAX_W, W - room.w - 2 * F);
  while (leftW > LEFT_W && strip(W - leftW) > bodyH - room.outerH) leftW--;
  const bandW = W - leftW;
  out.push(R('view', leftW, BAR_H, bandW, room.outerH), R('feed', leftW, BAR_H + room.outerH, bandW, bodyH - room.outerH));

  // ---- the left column: one panel of one constant height over the event log, whatever it shows. The
  // panel holds the cat readout (a hint until a cat is picked) or the open editor in the same rectangle,
  // so neither the panel nor the log moves when a cat is picked or an editor opens. Its height is the
  // tallest of the four editors and the full readout, cut to what leaves the log two whole messages.
  const logMin = CONTENT.logHeightFor(leftW, st, LOG_MIN_MSGS.desktop);
  const edMax = Math.max(...Object.values(EDITABLE).map(ed => px(CONTENT.editor(leftW, ed))));
  const cap = H - BAR_H - logMin;
  if (edMax > cap) throw new Shortfall('left panel holding the tallest editor', edMax, cap);
  const panelH = Math.min(cap, Math.max(edMax, CONTENT.readoutFit(leftW, 1e6).used));
  // The top cats (Nov 16 request, Erwin Reviews 15-16): a slot of their own at the foot of the readout panel, there
  // whether or not a cat is picked. The readout gives up its optional blocks (personality, feelings) to keep it; an
  // open editor takes the whole panel as before, so the panel and the log keep one size.
  const lead = leadersLayout(leftW), readH = panelH - lead.h - GAP;
  const fit = CONTENT.readoutFit(leftW, readH);
  if (!fit.fits) throw new Shortfall('cat readout above the top cats in the left panel', fit.required, readH);
  out.push(R(st.editor.length ? 'editor-' + st.editor[0] : 'readout', 0, BAR_H, leftW, panelH));
  out.push(R('log', 0, BAR_H + panelH, leftW, H - BAR_H - panelH));
  return { rects: out, form: 'desktop', feedMode: 'values', chart: chartLayout(bandW - 2 * F, feedHeight(bandW - 2 * F)),
