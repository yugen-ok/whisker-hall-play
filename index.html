<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Whisker Hall: cat shelter simulation</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='62' r='22' fill='%23355f86'/%3E%3Ccircle cx='24' cy='36' r='10' fill='%23355f86'/%3E%3Ccircle cx='42' cy='22' r='10' fill='%23355f86'/%3E%3Ccircle cx='60' cy='22' r='10' fill='%23355f86'/%3E%3Ccircle cx='77' cy='36' r='10' fill='%23355f86'/%3E%3C/svg%3E">
<style>
/* Every value below is a custom property generated from src/tokens.js by build-play.js. No colour,
   size or spacing is written here by hand: the tokens file is the only place one is decided. */
:root{
 --bg:#f6efe3;
 --surface:#fffcf6;
 --surfaceAlt:#f8f1e4;
 --ink:#2e241d;
 --muted:#6a5646;
 --line:#e6d8c3;
 --lineStrong:#8d7660;
 --accent:#355f86;
 --accentInk:#ffffff;
 --accentSoft:#e3ebf3;
 --header:#4a3a2e;
 --headerInk:#fff6ea;
 --track:#efe3d0;
 --need:#a8661f;
 --trait:#557848;
 --good:#43703e;
 --goodSoft:#e5efdc;
 --warn:#a3400f;
 --warnSoft:#fbe6d8;
 --alert:#b02a22;
 --alertSoft:#fbe1dc;
 --scrim:rgba(46, 36, 29, 0.45);
 --room-floor:#e8cfa6;
 --room-floorGrain:#dec396;
 --room-seam:#b89366;
 --room-rug:#d9e1cb;
 --room-rugWeave:#b9c7a3;
 --room-rugEdge:#5f7a4d;
 --room-wall:#6b4f3a;
 --room-wallInk:#4a3528;
 --room-light:#fff8e6;
 --room-shadow:rgba(60, 40, 20, 0.16);
 --room-doorOpen:#335d2e;
 --room-doorShut:#9c231b;
 --room-tooltipBg:#3a2c22;
 --room-tooltipInk:#fff6ea;
 --fs-ui:14px;
 --fs-prose:15px;
 --fs-lead:16px;
 --fs-value:22px;
 --fs-display:28px;
 --lh-ui:21px;
 --lh-prose:24px;
 --lh-lead:24px;
 --lh-value:28px;
 --fw-normal:400;
 --fw-medium:600;
 --fw-bold:700;
 --sp-xs:4px;
 --sp-sm:8px;
 --sp-md:12px;
 --sp-lg:16px;
 --sp-xl:24px;
 --sz-target:44px;
 --sz-bar:56px;
 --sz-card:56px;
 --sz-logHeader:24px;
 --sz-logPad:4px;
 --sz-barTrack:7px;
 --sz-catScale:1.35px;
 --r-sm:4px;
 --r-md:8px;
 --r-lg:12px;
 --r-pill:999;
 --el-flat:none;
 --el-card:0 1px 2px rgba(46, 36, 29, 0.07);
 --el-raised:0 4px 14px rgba(46, 36, 29, 0.14);
 --mo-fast:120ms;
 --mo-normal:200ms;
 --font-stack:"Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);
 font:var(--fw-normal) var(--fs-ui)/var(--lh-ui) var(--font-stack);
 -webkit-font-smoothing:antialiased}

/* ---------- regions ----------
   One absolutely positioned element per rectangle the layout engine solves, placed from
   src/layout.js. Nothing in this stylesheet decides where anything goes; it decides only what a
   region looks like once it has been put there. */
#app{position:absolute;inset:0;overflow:hidden}
.region{position:absolute;overflow:hidden;display:flex}
.panel{position:absolute;inset:1px;background:var(--surface);border:1px solid var(--line);
 border-radius:var(--r-lg);box-shadow:var(--el-card);overflow:hidden;display:flex;flex-direction:column}
.panel.flat{background:transparent;border:0;box-shadow:none}
.panel.pad{padding:var(--sp-md)}

/* ---------- controls ---------- */
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:var(--sp-sm);
 width:100%;height:100%;min-height:var(--sz-target);padding:0 var(--sp-md);
 font-weight:var(--fw-bold);color:var(--ink);background:var(--surface);
 border:1px solid var(--line);border-radius:var(--r-md);white-space:nowrap;
 transition:background var(--mo-fast),border-color var(--mo-fast)}
.btn:hover{border-color:var(--accent);background:var(--accentSoft)}
.btn[aria-pressed="true"],.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.btn.quiet{border-color:transparent;background:transparent}
.btn.quiet:hover{border-color:var(--accent);background:var(--accentSoft)}
.btn.danger{color:var(--alert);border-color:var(--line)}
.btn.danger:hover{background:var(--alertSoft);border-color:var(--alert)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--r-sm)}

input[type=number],input[type=time],select{font:inherit;font-weight:var(--fw-bold);color:var(--ink);
 background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
 min-height:var(--sz-target);padding:0 var(--sp-sm);text-align:center}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
input[type=range]{accent-color:var(--accent);height:var(--sz-target);cursor:pointer;margin:0}

/* ---------- clock and transport ---------- */
.clock{display:flex;align-items:center;justify-content:center;width:100%;height:100%;
 font-size:var(--fs-lead);line-height:var(--lh-lead);font-weight:var(--fw-bold);
 font-variant-numeric:tabular-nums;white-space:nowrap}
.speed{display:flex;align-items:center;gap:var(--sp-sm);width:100%;height:100%;padding:0 var(--sp-md)}
.speed input{flex:1 1 auto;min-width:0}
.speed .read{flex:none;font-weight:var(--fw-bold);font-variant-numeric:tabular-nums;white-space:nowrap}
/* Every form opens with one BAR_H bar across the top, so the header colour is a band of exactly that
   height behind the page: the transport and the controls beside it read as one strip heading the
   screen. The clock and the speed read-out sit on it directly; buttons and cards keep their surfaces. */
#app{background:linear-gradient(to bottom,var(--header) var(--sz-bar),transparent var(--sz-bar))}
#r-clock,#r-speed{color:var(--headerInk)}
#r-pause .btn{background:var(--headerInk);color:var(--header);border-color:var(--headerInk)}
#r-speed input[type=range]{accent-color:var(--headerInk)}
/* The one primary action in the column: switching between the room and the statistics. */
#r-toggle-view .btn{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}

/* ---------- budget cards ---------- */
.card{display:flex;align-items:center;gap:var(--sp-sm);width:100%;height:100%;
 padding:0 var(--sp-md);text-align:left;border:1px solid var(--line);border-radius:var(--r-lg);
 background:var(--surface);box-shadow:var(--el-card);cursor:pointer}
.card:hover{border-color:var(--accent);background:var(--accentSoft)}
.card[aria-expanded="true"]{border-color:var(--accent);background:var(--accentSoft)}
.card .title{font-size:var(--fs-lead);line-height:var(--lh-lead);font-weight:var(--fw-bold);white-space:nowrap}
.card .value{margin-left:auto;font-weight:var(--fw-bold);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--good)}
.card .value.warn{color:var(--warn)}
.card .value.alert{color:var(--alert)}
.card .chev{flex:none;color:var(--muted);font-weight:var(--fw-bold)}
/* On a phone the card is a chip: the engine reserves CARD_CHIP_W for the budget string, which the
   long form does not fit, so the name sits over the value and both stay at 14px. */
.card.chip{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;padding:0 var(--sp-sm)}
.card.chip .title{font-size:var(--fs-ui);line-height:var(--lh-ui)}
.card.chip .value{margin-left:0;line-height:var(--lh-ui)}
.card.chip .title,.card.chip .value{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.doors{display:flex;gap:var(--sp-sm);width:100%;height:100%;align-items:center;padding:0 var(--sp-sm)}
.doors .btn{flex:1 1 0;min-width:0;padding:0 var(--sp-sm);overflow:hidden}

/* ---------- editors ---------- */
/* As a phone view an editor carries its own title, so the fields take what the title leaves. */
.editorview{position:absolute;inset:0;display:flex;flex-direction:column}
.editorview > .editor{flex:1 1 0;height:auto;min-height:0}
.editor{display:flex;flex-wrap:wrap;gap:var(--sp-sm);align-content:flex-start;
 width:100%;height:100%;padding:var(--sp-md);background:var(--accentSoft);
 border:1px solid var(--accent);border-radius:var(--r-md)}
.field{display:flex;align-items:center;gap:var(--sp-sm);white-space:nowrap}
.field > span{color:var(--muted);font-weight:var(--fw-bold)}
.field input{width:53px}
/* The meal times wrap onto rows of TARGET + GAP, which is how the engine sizes the feeding editor. */
.field.times{flex:1 1 100%;flex-wrap:wrap;white-space:normal;row-gap:var(--sp-sm)}
.field.times input{flex:none}
.editor .note{flex:1 1 100%;color:var(--muted);line-height:var(--lh-ui)}
.editor .note.bad{color:var(--alert);font-weight:var(--fw-bold)}

/* ---------- the live feed ---------- */
.feed{display:grid;gap:1px;width:100%;height:100%;background:transparent}
.cell{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;min-height:0;
 padding:var(--sp-sm);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--el-card)}
/* A count that is still zero is recessed and drawn without its trend, which would be a flat line. */
.cell.none{background:var(--surfaceAlt);box-shadow:none}
.cell.none .val{color:var(--muted);font-size:var(--fs-lead);line-height:var(--lh-lead);font-weight:var(--fw-medium)}
.cell.none canvas{visibility:hidden}
.cell .name{color:var(--muted);font-weight:var(--fw-bold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .val{font-size:var(--fs-value);line-height:var(--lh-value);font-weight:var(--fw-bold);
 font-variant-numeric:tabular-nums;white-space:nowrap}
.cell canvas{display:block;flex:1 1 0;min-height:0;width:100%}

/* ---------- the selected-cat readout ---------- */
.readout{display:flex;flex-direction:column;gap:var(--sp-sm);width:100%;height:100%;padding:var(--sp-md) var(--sp-sm);
 background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line),var(--el-card)}
/* The name on its own line, the description wrapped under it: identity text is never cut. */
.readout .ident{display:flex;flex-direction:column;flex:none;overflow:hidden}
.readout .nm{font-size:var(--fs-lead);line-height:var(--lh-lead);font-weight:var(--fw-bold)}
.readout .meta{color:var(--muted)}
.readout .doing{display:flex;align-items:center;gap:var(--sp-sm);flex:none;font-weight:var(--fw-bold);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout .doing .dot{flex:none;width:10px;height:10px;border-radius:var(--r-pill)}
.blocks{display:flex;flex-wrap:wrap;gap:var(--sp-sm);align-content:flex-start;min-height:0}
.block{min-width:0;overflow:hidden}
.block h3{margin:0;font-size:var(--fs-ui);line-height:var(--lh-ui);font-weight:var(--fw-bold);color:var(--muted)}
.rows{display:grid;gap:0 var(--sp-sm)}
.row{display:grid;grid-template-columns:77px 1fr 49px;align-items:center;gap:var(--sp-sm);white-space:nowrap;overflow:hidden}
.row .lab{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.row .bar{height:var(--sz-barTrack);border-radius:var(--r-pill);background:var(--track);
 box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
/* A value above zero is never thinner than a visible nub, so 1% reads as 1% and not as missing. */
.row .bar > i{display:block;height:100%;min-width:var(--sp-xs);border-radius:var(--r-pill)}
.row .num{text-align:right;font-weight:var(--fw-bold);font-variant-numeric:tabular-nums}

/* ---------- the event log: the only scrolling region in the interface ---------- */
.log{display:flex;flex-direction:column;width:100%;height:100%;min-height:0;
 background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line)}
.log h2{flex:none;margin:0;padding:0 var(--sp-sm);height:var(--sz-logHeader);display:flex;align-items:center;
 font-size:var(--fs-ui);line-height:var(--lh-ui);font-weight:var(--fw-bold);color:var(--muted);
 border-bottom:1px solid var(--line)}
.log ol{flex:1 1 0;min-height:0;margin:0;padding:var(--sp-logPad) 0;list-style:none;
 overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.log li{display:grid;grid-template-columns:auto auto 1fr;gap:var(--sp-sm);align-items:baseline;
 padding:0 var(--sp-logPad);line-height:var(--lh-ui)}
.log li .ix{font-weight:var(--fw-bold);font-variant-numeric:tabular-nums;color:var(--muted)}
.log li .at{color:var(--muted);font-variant-numeric:tabular-nums}
.log li.marked .ix{color:var(--accentInk);background:var(--accent);border-radius:var(--r-sm);padding:0 4px}
.log li.marked.fight .ix{background:var(--alert)}
.log li.host .msg{color:var(--alert)}
.log li.event .msg{color:var(--accent);font-weight:var(--fw-bold)}

/* ---------- the panes a view can be ----------
   Exactly one is on screen at a time; the rest carry `hidden`. Each keeps its own layout mode, so
   showing one never has to restore it. */
.pane{position:absolute;inset:0}
.hidden{display:none !important}
.controlsview{display:grid}

/* ---------- the room ---------- */
.room{display:flex;align-items:center;justify-content:center}
.room canvas{display:block;border-radius:var(--r-md);background:var(--room-floor)}

/* ---------- the guide ---------- */
.guide{padding:var(--sp-lg);overflow:hidden;display:flex;flex-direction:column}
.guide .pages{flex:1 1 0;min-height:0;position:relative}
.guide .page{position:absolute;inset:0;font-size:var(--fs-prose);line-height:var(--lh-prose)}
.guide h2{margin:0 0 var(--sp-sm);font-size:var(--fs-lead);line-height:var(--lh-lead);color:var(--accent)}
.guide h3{margin:var(--sp-md) 0 2px;font-size:var(--fs-prose);line-height:var(--lh-prose)}
.guide p,.guide li{margin:0 0 var(--sp-sm);font-size:var(--fs-prose);line-height:var(--lh-prose)}
.guide ul{margin:0 0 var(--sp-sm);padding-left:var(--sp-lg)}
.guide .foot{flex:none;display:flex;align-items:center;gap:var(--sp-sm);padding-top:var(--sp-sm)}
.guide .foot .at{margin-left:auto;color:var(--muted);font-weight:var(--fw-bold)}
.guide .foot .btn{width:auto;min-width:var(--sz-target)}

/* ---------- the statistics view ---------- */
.srect{position:absolute;overflow:hidden}
.srect.chart{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r-lg)}
.srect.chart canvas{display:block;width:100%;height:100%}
.tabs{display:flex;gap:var(--sp-sm);width:100%;height:100%}
.tabs .btn{width:auto;flex:1 1 0;min-width:0}
.selector{width:100%;height:100%}
.selector .btn{justify-content:space-between}
.spanel{background:var(--surface);border:1px solid var(--accent);border-radius:var(--r-md);
 padding:var(--sp-md);display:grid;gap:0 var(--sp-sm);align-content:start;overflow:hidden}
.opt{display:flex;align-items:center;gap:var(--sp-sm);white-space:nowrap;cursor:pointer;
 padding:0 var(--sp-xs);border-radius:var(--r-sm);overflow:hidden}
.opt:hover{background:var(--accentSoft)}
.opt .tick{flex:none;width:18px;height:18px;border:2px solid var(--lineStrong);border-radius:var(--r-sm);
 display:flex;align-items:center;justify-content:center;color:var(--accentInk);font-weight:var(--fw-bold)}
.opt[aria-checked="true"] .tick{background:var(--accent);border-color:var(--accent)}
.opt .sw{flex:none;width:12px;height:12px;border-radius:var(--r-sm)}
.opt .lb{overflow:hidden;text-overflow:ellipsis}
.legendrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:var(--lh-ui)}
.pager{display:flex;align-items:center;gap:var(--sp-sm);width:100%;height:100%;justify-content:flex-end}
.pager .at{font-weight:var(--fw-bold);font-variant-numeric:tabular-nums;white-space:nowrap}
.pager .btn{width:var(--sz-target);flex:none}
.table{width:100%;height:100%;overflow:hidden;font-variant-numeric:tabular-nums}
/* The column widths the engine reserved already carry their own padding, so a row adds none. */
.table .tr{display:grid;align-items:center;height:var(--lh-ui);white-space:nowrap}
.table .tr > span{padding:0 var(--sp-sm);overflow:hidden;text-overflow:ellipsis}
.table .tr.head{font-weight:var(--fw-bold);color:var(--muted);border-bottom:1px solid var(--line)}
.table .tr.alt{background:var(--surfaceAlt)}
.table .tr > span.n{text-align:right}
.ttl{margin:0;padding:0 var(--sp-sm);font-size:var(--fs-ui);line-height:var(--lh-ui);
 font-weight:var(--fw-bold);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keyband{display:grid;gap:0 var(--sp-sm);align-content:center;width:100%;height:100%;padding:0 var(--sp-sm)}
.keyband .k{display:flex;align-items:center;gap:var(--sp-sm);white-space:nowrap;overflow:hidden;line-height:var(--lh-ui)}
.keyband .k{cursor:default}
.keyband .k i{flex:none;width:18px;height:0}
</style></head><body>
<div id="app"></div>
<script>
/* The single source of every colour, size, spacing and radius the caregiver UI uses.
   Nothing in the interface hard-codes any of these: the CSS custom properties below are generated from
   this file by build-play.js, and the canvas reads the same object directly, so the painted room and the
   DOM chrome can never drift apart.

   The palette is warm and illustrated (docs/LAYOUT.md section 9): cream paper, oak and fabric in the
   room, real fur on the cats, and a dusty navy for everything the caregiver can press. The accent is
   kept apart from alert red on purpose, so an action never looks like a fight. Contrast is asserted
   rather than eyeballed: contrastReport() checks every text pair against WCAG 2.1 SC 1.4.3 (4.5:1) and
   every graphical pair against SC 1.4.11 (3:1), and `node src/tokens.js` prints the table and exits
   non-zero on a failure. */
(function (root, factory) {
  const node = typeof module !== 'undefined' && !!module.exports;
  const api = factory();
  if (node) module.exports = api; else (root.WH || (root.WH = {}))['tokens'] = api;
})(typeof self !== 'undefined' ? self : null, function () {
'use strict';

// ---------------------------------------------------------------- colour
// Semantic roles only. A component asks for surface or alert, never for a hex value, so the one place a
// colour decision is made is this block.
const color = {
  bg:         '#f6efe3',   // the page behind the cards: cream paper
  surface:    '#fffcf6',   // a card, a panel, a field
  surfaceAlt: '#f8f1e4',   // alternating table rows, an inset well, a tile with nothing to show yet
  ink:        '#2e241d',   // body and data text
  muted:      '#6a5646',   // labels and secondary text
  line:       '#e6d8c3',   // borders and dividers
  lineStrong: '#8d7660',   // an axis, a matrix grid, the edge of a control that must read as a control
  accent:     '#355f86',   // interactive accent, the selected state, the focus ring
  accentInk:  '#ffffff',   // text on the accent
  accentSoft: '#e3ebf3',   // the fill behind a selected row or an open disclosure
  header:     '#4a3a2e',   // the clock and transport strip that heads the left column
  headerInk:  '#fff6ea',   // text and controls on the header strip
  track:      '#efe3d0',   // the empty part of a bar, so a low value still reads as a value
  need:       '#a8661f',   // a need bar: honey
  trait:      '#557848',   // a personality bar: sage
  good:       '#43703e',   // calm, inside budget
  goodSoft:   '#e5efdc',
  warn:       '#a3400f',   // caution, at the edge of a budget, a need running high
  warnSoft:   '#fbe6d8',
  alert:      '#b02a22',   // stress, a fight, over budget
  alertSoft:  '#fbe1dc',
  scrim:      'rgba(46, 36, 29, 0.45)',
};

// The room itself: oak planks in the main room and a woven sage rug in the quiet room, so the two rooms
// are told apart by their floors before anything is read.
const room = {
  floor:      '#e8cfa6',   // oak plank
  floorGrain: '#dec396',   // the alternate plank and the grain drawn along it
  seam:       '#b89366',   // the joint between planks
  rug:        '#d9e1cb',   // the quiet room's woven rug
  rugWeave:   '#b9c7a3',
  rugEdge:    '#5f7a4d',   // the rug's bound edge and stitching
  wall:       '#6b4f3a',
  wallInk:    '#4a3528',   // fixed obstacles and the room names
  light:      '#fff8e6',   // the patch of daylight a window throws on the floor
  shadow:     'rgba(60, 40, 20, 0.16)',
  doorOpen:   '#335d2e',
  doorShut:   '#9c231b',
  tooltipBg:  '#3a2c22',
  tooltipInk: '#fff6ea',
};

// Furniture, by what the object is. Each sprite is drawn from a body, an edge, one content colour and
// one detail colour; every object has its own silhouette first and its own colour second.
const object = {
  bowl:    { body: '#c4573c', edge: '#5a4030', content: '#8a5a32', detail: '#f4ead8' },   // coral bowl, kibble
  water:   { body: '#33658a', edge: '#5a4030', content: '#4f8fb0', detail: '#ffffff' },   // steel-blue bowl, water
  litter:  { body: '#8b8f7a', edge: '#5a4030', content: '#ece0c6', detail: '#8b8f7a' },   // tray, sand
  bed:     { body: '#7f9f74', edge: '#5a4030', content: '#e9e0c9', detail: '#5a4030' },   // sage cushion
  perch:   { body: '#c9b08a', edge: '#5a4030', content: '#9c7a59', detail: '#d8bf8c' },   // carpeted cat tree
  hide:    { body: '#c6955b', edge: '#5a4030', content: '#3a2a1e', detail: '#7d5530' },   // cardboard box
  scratch: { body: '#d8bf8c', edge: '#5a4030', content: '#8a6b3c', detail: '#c9b08a' },   // sisal post

// space the view was given and did not use, and which the no-wasted-space rule forbids.
const BODY_FILL_MIN = 0.90;
const SWATCH = 18;                       // colour key plus its gap, so a series label is identifiable
const TICK = 24;                         // the checked state of a multi-select row

// A chart that reports a percentage gets one pixel per percent, plus two axis label lines: the same rule
// docs/LAYOUT.md section 4 uses for a labelled bar and for the parent's statistics minimum.
const CHART_MIN_H = 100 + 2 * LINE;      // 142
// A time axis has to carry at least two readable labels, which is the floor play.js already uses
// (nLab = max(2, floor(plotWidth / 90))), plus the value-axis gutter.
const CHART_MIN_W = TX('axisPct') + GAP + 2 * 90;

// The metrics the view offers and the unit each is in, declared in stats-metrics.js so every label is
// measured. Stress is here once, as the Cat-Stress-Score: CSS and stress are one quantity read two ways.
const METRIC_LIST = METRICS.metrics, N_METRICS = METRIC_LIST.length;
// Four units: 1-7, % of cats, per day, cats. That is the whole reason the trends page is small multiples
// rather than one chart. A shared 0-100% axis for stress and hostile interaction said the two were
// comparable quantities, and they are not; a reader decodes position against a scale (Cleveland & McGill
// 1984), so two scales drawn as one is a false reading, not a crowded one.
const UNIT_AXIS = { css: 'axisCss', pct: 'axisPct', rate: 'axisRate', count: 'axisCount' };
const AXIS_W = Math.max(...Object.values(UNIT_AXIS).map(TX));
// One trends panel: a title carrying the metric and the unit of its own axis, then a plot one pixel per
// percent tall, then the time labels. Width is whichever is larger, the title or an axis with two
// readable time labels under it.
const TREND_MIN_W = Math.max(TX('trendTitle') + 2 * GAP, AXIS_W + GAP + 2 * 90);
const TREND_MIN_H = LINE + 100 + LINE;   // 142, the same arithmetic as CHART_MIN_H, spelled out

// A small-multiple panel: its title line, then a plot at least one target tall, because tapping the
// panel is how a cat is selected.
const SM_MIN_W = TX('smTitle') + 2 * GAP;
const SM_MIN_H = LINE + TARGET + 2 * 6;

// A relationship-matrix cell is tappable (it opens that pair), so its first choice is a 44 px target.
// Where a 44 px grid does not fit, the cell falls back to the width that still carries the value it
// prints at 14 px, which is the floor: WCAG 2.1 SC 2.5.5 allows a smaller target when an equivalent
// control exists elsewhere, and the cat selector reaches every pair. Below that the matrix pages.
const CELL_FULL = TARGET, CELL_MIN = TX('matrixCell') + 2 * 4;
const ROWLAB = TX('matrixRow') + GAP;
// Below this a matrix block shows so few cats per page that the pairs cannot be compared, and the page
// shows one cat's outgoing affinities as a dot plot instead: same values, same encoding (position on a
// common scale, Cleveland & McGill 1984), one cat at a time.
const MATRIX_MIN_BLOCK = 6;
const AFF_ROW_W = ROWLAB + 100;          // name, then one pixel per percent of the -1..+1 range

// Distribution panels. The histogram bins the Cat-Stress-Score over its published 1..7 range in halves,
// which is 12 bins; a bin is not tapped, so its floor is the bin label it carries.
const BINS = 12, BIN_W = TX('binLabel') + 4;
const HIST_MIN_W = TX('axisPct') + GAP + BINS * BIN_W;
const HOUR_W = TX('hourLabel') + 4;
const HOUR_MIN_W = TX('axisPct') + GAP + 24 * HOUR_W;
const DOT_MIN_W = TX('matrixRow') + GAP + 100 + 2 * PAD;   // name, then one pixel per percent

// The colony page falls back to one cat per page where it cannot be a table. A label-value row carries
// the widest column name and the widest value it can print.
const RECORD_ROW_W = TX('recordRow') + 2 * GAP;
const RECORD_HEAD_H = FS.lead + 6 + 4;
// Fewer than three metric columns beside the name is not a table: a reader comparing two cats would be
// paging sideways through pairs of numbers, which is worse than reading one cat whole.
const MIN_TABLE_COLS = 3;

// Colony table: the name column, then one column per metric, each holding its header on one line.
const TCOL_NAME = TX('matrixRow') + 2 * GAP;
const TCOL = Math.max(TX('colHeader'), TX('colCell')) + 2 * GAP;
const TOTAL_CELL = TX('totalsRow') + 2 * GAP;

// Selector panels: a multi-select row is a target carrying its swatch, its label and its tick.
const PANEL_W = {
  metrics: TX('optMetric') + SWATCH + TICK + 2 * PAD,
  // The cats panel lists every cat and, above them, the shelter aggregate, which is the longer of
  // the two strings. Sizing it from the cat name alone put an ellipsis through "Shelter aggregate".
  cats: Math.max(TX('optCat'), TX('keyAggregate')) + SWATCH + TICK + 2 * PAD,
  gran: Math.max(TX('selGran'), TX('selRange')) + TICK + 2 * PAD,
  // The legend is prose, so its floor is a readable measure rather than one string: 45 characters is
  // the bottom of the 45-75 character line, and WCAG 1.4.8 caps the top at 80.
  legend: Math.max(TX('legendMeasure'), TX('legendTerm')) + 2 * PAD,
};
PANEL_W.range = PANEL_W.gran;
// A legend row is a line of prose, not a tappable option, so it is a text line high and not a target.
const PANEL_ROW_H = id => id === 'legend' ? LINE : TARGET;
const PAGER_W = TX('pager') + GAP + 2 * TARGET + 2 * PAD;

// The five pages. Together they carry every quantity in the inventory (docs/LAYOUT.md section 12).
const PAGES = ['trends', 'percat', 'distribution', 'relationships', 'table'];
const TAB = { trends: 'tabTrends', percat: 'tabPerCat', distribution: 'tabDistribution', relationships: 'tabRelationships', table: 'tabTable' };

// ---------------------------------------------------------------- the legend
// Tier 3 reference material on demand: what every metric on screen means, and on what authority. It
// lives here rather than in play.js because the sub-layout has to size it, and a panel sized for a
// different number of rows than the view draws is exactly the kind of disagreement this split
// exists to prevent. N_OPT.legend is this array's length, by construction.
//
// Each entry is one 21px line, which is what PANEL_ROW_H('legend') reserves, so a statement longer
// than a line is written as consecutive lines rather than left to wrap into a row that is not there.
// stats-solver.js asserts every line fits the narrowest panel the layout produces.
const LEGEND = [
  'Cat-Stress-Score: 1 to 7, read off stress',
  'Hunger, thirst, bladder: % of a cat',
  'Sleepiness, irritation: % of a cat',
  'Social need, play need: % of a cat',
  'Cats hiding, queueing: % of the colony',
  'Friendly, hostile: % of the colony now',
  'Fights per day: resolved fights',
  'Swats per day: fight starts',
  'Hisses per day: threats, no contact',
  'Intakes and adoptions: arrivals, homes',
  'Cats in the shelter: the headcount',
  '',
  'Cat-Stress-Score scale: Kessler and',
  'Turner 1997. The 1 to 7 scale is',
  'published; the 0.622 exponent that maps',
  'our stress onto it is our assumption,',
  'not a published figure.',
  '',
  'Trends: the aggregate is the solid line,',
  'each selected cat a thin one. One panel,',
  'one unit, one scale, never two.',
  '',
  'Matrix fill: affinity, -1 to +1, how the',
  'row cat feels about the column cat.',
  'Matrix corner wedge: fear, 0 to 1.',
  'Affinity fades with a 5-day half-life,',
  'fear in about a day.',
  '',
  'The colony table counts the whole run,',
  'not the range chosen above.',
];
// The width one character of legend prose takes, derived from the measured 45-character measure
// rather than guessed, so the fit assert is in the same units as everything else here.
const LEGEND_CHAR_W = TX('legendMeasure') / [...METRICS.measured.legendMeasure.text].length;

const SELECTORS = [
  { id: 'metrics', label: 'selMetrics', side: 'left' },
  { id: 'cats', label: 'selCats', side: 'left' },
  { id: 'gran', label: 'selGran', side: 'right' },
  { id: 'range', label: 'selRange', side: 'right' },
  // Tier 3 reference material, on demand: what every metric on screen means, and on what authority.
  // It is where the Cat-Stress-Score assumption is stated, because CSS is a reading of stress and not a
  // second metric, so it belongs in the definition of the metric and not beside it on a chart.
  { id: 'legend', label: 'selLegend', side: 'right' },
];
// Worst-case option counts: every metric, every cat plus the All / none row, and a legend carrying one
// definition per metric plus a three-line note on the Cat-Stress-Score.
const N_OPT = { metrics: N_METRICS, cats: n => n + 1, gran: 5, range: 5, legend: LEGEND.length };
const N_TABLE_COLS = 11;      // the per-cat time-use columns in stats.js summary()
const N_TOTALS = 12;          // the shelter-wide scalars in summary(), plus the three budgets

// ---------------------------------------------------------------- geometry helpers
const R = (id, x, y, w, h, extra) => Object.assign({ id, x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h) }, extra || {});
// Splits a run of pixels into n parts summing exactly to it, so a grid tiles with no leftover column.
function share(total, n) {
  const base = Math.floor(total / n), rem = total - base * n, out = [];
  for (let i = 0; i < n; i++) out.push(base + (i < rem ? 1 : 0));
  return out;
}
// With everything on one page, prefer the squarest grid: a wall of 16 panels one row tall is harder to
// compare across than a 4 x 4 block (Tufte: small multiples are compared in two directions).
// The grid a page of n panels is laid on: as many slots as the body can carry, with no holes in it.
// A hole is space the page was given and did not use, and thirteen panels in a four-by-four grid
// leave three of them. So the grid is always full: either it holds all n (when some column count
// divides n, or n fits in one row), or it holds the largest full block the body allows and the rest
// is a second page. Equal panels and a pager beat a ragged last row, because the whole point of a
// small-multiple display is that the panels are the same size.
function bestGrid(maxCols, maxRows, n) {
  let best = null;
  const consider = (c, r) => {
    if (c < 1 || r < 1 || c > maxCols || r > maxRows) return;
    const slots = c * r;
    if (slots > n) return;                                  // a hole
    const score = [slots, -Math.abs(c - r)];
    if (!best || score[0] > best.score[0] || (score[0] === best.score[0] && score[1] > best.score[1])) best = { cols: c, rows: r, score };
  };
  for (let c = 1; c <= Math.min(maxCols, n); c++) { consider(c, Math.ceil(n / c)); consider(c, Math.floor(n / c)); }
  return best ? { cols: best.cols, rows: best.rows } : { cols: Math.min(maxCols, n), rows: 1 };
}
const bestCols = (maxCols, maxRows, n) => bestGrid(maxCols, maxRows, n).cols;
// A pager is a control, and this view already has a band for controls. Where the body can spare a 56px
// row the pager sits at the body's foot, next to the content it pages (Fitts: close to what it acts on).
// Where it cannot, it goes in the leftover width of a control row instead: a page that gave up its only
// chart row to a pager would be paging through nothing worth seeing. A page shows one pager at most, so
// the pool is claimed once per state.
function pagerPool(slots) {
  return {
    slots: slots.filter(s => s.w >= PAGER_W),
    free() { return this.slots.length > 0; },
    claim(body, rects, id) {
      const s = this.slots.shift();
      if (s) { rects.push(R(id, s.x + s.w - PAGER_W, s.y, PAGER_W, TARGET, { kind: 'control', content: [PAGER_W, TARGET] })); return 'control band'; }
      rects.push(R(id, body.x + body.w - PAGER_W, body.y + body.h - TARGET, PAGER_W, TARGET, { kind: 'control', content: [PAGER_W, TARGET] }));
      return 'body foot';
    },
  };
}

// Trends panels are time series, so they are laid across the row first and wrapped: a time series is
// read along its time axis, and the wider it is the shallower the slopes it can resolve (Cleveland's
// banking argument). That is the opposite of the per-cat small multiples below, where the squarest grid
// wins because the comparison there runs in two directions at once.
function trendPage(w, h, n, pagerH) {
  const maxCols = Math.max(1, Math.floor((w + GAP) / (TREND_MIN_W + GAP)));
  const maxRows = Math.max(1, Math.floor((h + GAP) / (TREND_MIN_H + GAP)));
  const g = bestGrid(maxCols, maxRows, n);
  if (g.cols * g.rows >= n) return { cols: g.cols, rows: g.rows, pages: 1, gridH: h };
  const h2 = h - (pagerH ? pagerH + GAP : 0);
  const rows2 = Math.max(1, Math.floor((h2 + GAP) / (TREND_MIN_H + GAP)));
  // A pager that would cost the page its last whole row of panels is not worth its row: the metrics
  // selector already decides which metrics are drawn, so it is the control that steps through them.
  if (rows2 < maxRows) return { cols: g.cols, rows: g.rows, pages: Math.ceil(n / (g.cols * g.rows)), gridH: h, pagerInSelector: true };
  const g2 = bestGrid(maxCols, rows2, n);
  return { cols: g2.cols, rows: g2.rows, pages: Math.ceil(n / (g2.cols * g2.rows)), gridH: h2 };
}

// How many minW x minH cells fit, and how many pages that takes. Paging, not scrolling, is how this view
// handles more content than its rectangle holds.
function gridPage(w, h, n, minW, minH, pagerH) {
  const maxCols = Math.max(1, Math.floor((w + GAP) / (minW + GAP)));
  const maxRows = Math.max(1, Math.floor((h + GAP) / (minH + GAP)));
  const g = bestGrid(maxCols, maxRows, n);
  if (g.cols * g.rows >= n) return { cols: g.cols, rows: g.rows, pages: 1, gridH: h };
  // It pages, so it needs a pager, and the grid is re-chosen in what the pager leaves.
  const h2 = h - pagerH - GAP;
  const rows2 = Math.max(1, Math.floor((h2 + GAP) / (minH + GAP)));
  const g2 = bestGrid(maxCols, rows2, n);
  return { cols: g2.cols, rows: g2.rows, pages: Math.ceil(n / (g2.cols * g2.rows)), gridH: h2 };
}
// Lays a grid of equal cells into a rectangle, tiling it exactly.
function layGrid(rect, idPrefix, n, cols, rows, out) {
  const ws = share(rect.w - (cols - 1) * GAP, cols), hs = share(rect.h - (rows - 1) * GAP, rows);
  let y = rect.y;
  for (let r = 0; r < rows; r++) {
    let x = rect.x;
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      if (i < n) out.push(R(`${idPrefix}-${i}`, x, y, ws[c], hs[r], { kind: 'chart', content: [ws[c], hs[r]] }));
      x += ws[c] + GAP;
    }
    y += hs[r] + GAP;
  }
  return { cellW: Math.min(...ws), cellH: Math.min(...hs) };
}

// ---------------------------------------------------------------- the stats area
// The stats area is the parent layout's `view` rectangle in its statistics state, and nothing else.
// Where the parent reallocated the live-feed band into that view (phone portrait), the parent has
// already done so and says why in `reallocated`; this sub-solve reads the result rather than deciding
// it again. One rectangle, one source of truth: a sub-solver that invented its own area could disagree
// with the layout it is a sub-solve of, and nothing would catch it.
function statsArea(parentState) {
  const view = parentState.rects.find(r => r.id === 'view');
  if (!view) throw new Error('the parent statistics state has no view rectangle');
  return { x: view.x, y: view.y, w: view.w, h: view.h,
    tookFeed: !!(parentState.reallocated && parentState.reallocated.to === 'view'),
    reallocated: parentState.reallocated || null };
}

// ---------------------------------------------------------------- the solve
function solve(parentState, form, state) {
  const area = statsArea(parentState), rects = [], fails = [], notes = [];
  if (area.reallocated) notes.push(`the parent gave this view the live-feed band (${area.reallocated.px}px): ${area.reallocated.why}`);
  const inner = { x: area.x + PAD, y: area.y + PAD, w: area.w - 2 * PAD, h: area.h - 2 * PAD };
  const nCats = state.cats;

  // --- the control bands. The page tabs are a segmented control where the five labels fit (Hick's law:
  // a small closed set is shown, not hidden in a menu); where they do not, the page becomes one
  // drop-down carrying its longest state.
  const tabW = PAGES.map(p => Math.max(TARGET, TX(TAB[p]) + 2 * PAD));
  const tabsNeed = tabW.reduce((a, b) => a + b, 0) + (PAGES.length - 1) * GAP;
  const selW = SELECTORS.map(s => Math.max(TARGET, TX(s.label) + 2 * PAD + 16));
  const selNeed = selW.reduce((a, b) => a + b, 0) + (SELECTORS.length - 1) * GAP;
  const dropW = Math.max(TARGET, TX('pageSelect') + 2 * PAD + 16);
  // The tabs stay a segmented control while they fit, and while keeping them does not cost the body the
  // row it needs for a chart. Where it would, the page becomes one drop-down and everything shares a
  // single band: a control row the chart cannot afford is a control row the chart is paying for.
  let tabsMode = tabsNeed <= inner.w ? 'segmented' : 'dropdown';
  let tabsW = tabsMode === 'segmented' ? tabsNeed : dropW;
  let oneRow = tabsW + GAP + selNeed <= inner.w;
  if (!oneRow && tabsMode === 'segmented' && dropW + GAP + selNeed <= inner.w) {
    const rowsIfSplit = 1 + Math.max(1, Math.ceil(selNeed / inner.w));
    if (inner.h - rowsIfSplit * BAR_H < CHART_MIN_H + BAR_H) { tabsMode = 'dropdown'; tabsW = dropW; oneRow = true; notes.push('page tabs collapse to a drop-down: a second control row would leave the body under the chart minimum'); }
  }

  // Each control row keeps whatever width its controls did not use, as a slot a pager can claim later.
  const slots = [];
  let y = inner.y;
  if (oneRow) {
    rects.push(R('stats-tabs', inner.x, y, tabsW, TARGET, { kind: 'control', content: [tabsW, TARGET] }));
    let sx = inner.x + inner.w;
    for (let i = SELECTORS.length - 1; i >= 0; i--) { sx -= selW[i]; rects.push(R('sel-' + SELECTORS[i].id, sx, y, selW[i], TARGET, { kind: 'control', content: [selW[i], TARGET] })); sx -= GAP; }
    slots.push({ x: inner.x + tabsW + GAP, y, w: sx - (inner.x + tabsW + GAP), h: TARGET });
    y += BAR_H;
  } else {
    rects.push(R('stats-tabs', inner.x, y, tabsW, TARGET, { kind: 'control', content: [tabsW, TARGET] }));
    slots.push({ x: inner.x + tabsW + GAP, y, w: inner.w - tabsW - GAP, h: TARGET });
    y += BAR_H;
    let i = 0;
    while (i < SELECTORS.length) {
      let used = 0, j = i;
      while (j < SELECTORS.length && used + selW[j] + (j > i ? GAP : 0) <= inner.w) { used += selW[j] + (j > i ? GAP : 0); j++; }
      if (j === i) j = i + 1;
      let sx = inner.x;
      for (let k = i; k < j; k++) { rects.push(R('sel-' + SELECTORS[k].id, sx, y, selW[k], TARGET, { kind: 'control', content: [selW[k], TARGET] })); sx += selW[k] + GAP; }
      slots.push({ x: sx, y, w: inner.x + inner.w - sx, h: TARGET });
      y += BAR_H; i = j;
    }
  }
  const controlH = y - inner.y;

  // --- the body, which is everything the page draws
  let body = { x: inner.x, y, w: inner.w, h: inner.y + inner.h - y };
  if (body.h < CHART_MIN_H) fails.push(`body ${body.h}px < chart minimum ${CHART_MIN_H}px, short ${CHART_MIN_H - body.h}px`);
  if (body.w < CHART_MIN_W) fails.push(`body ${body.w}px < chart minimum ${CHART_MIN_W}px`);

  // --- an open selector takes a slab of the body flush to its own side, directly under its trigger
  // (ui.md stage 2: a disclosure opens in a reserved region anchored to its trigger). The chart keeps
  // the rest. Where the slab cannot leave a readable chart, it takes the body whole, which is what a
  // native select does; no other rectangle moves either way, so the geometry is stable.
  let panelMode = 'none', panelFacts = null;
  if (state.open !== 'none' && body.h >= TARGET) {
    const id = state.open, nOpt = typeof N_OPT[id] === 'function' ? N_OPT[id](nCats) : N_OPT[id];
    const side = SELECTORS.find(s => s.id === id).side, rowH = PANEL_ROW_H(id);
    const rowsFit = Math.max(1, Math.floor((body.h - 2 * PAD + GAP) / (rowH + GAP)));
    const colsWanted = Math.ceil(nOpt / rowsFit);
    const colsCanSlab = Math.max(0, Math.floor((body.w - CHART_MIN_W - GAP + GAP) / (PANEL_W[id] + GAP)));
    const cols0 = colsWanted, w0 = cols0 * (PANEL_W[id] + GAP) - GAP;
    const slabBody = side === 'left' ? { x: body.x + w0 + GAP, y: body.y, w: body.w - w0 - GAP, h: body.h }
      : { x: body.x, y: body.y, w: body.w - w0 - GAP, h: body.h };
    // A slab is only a slab if the page can still be drawn in what it leaves. The CHART_MIN_W guard
    // alone was not enough: a 320px body clears the chart minimum and still cannot carry the colony
    // table, and a 232px one cannot carry a trends panel. So the page is laid into the reduced body as
    // a trial, and the slab is kept only if that trial asserts clean. Otherwise the panel opens over
    // the whole body, which is what a native select does, and the page is simply not on screen while
    // the caregiver is choosing. Either way no other rectangle moves.
    let slabOk = false;
    if (colsCanSlab >= colsWanted && slabBody.w > 0) {
      const t = { rects: [], fails: [], notes: [] };
      try { layPage(state.page, slabBody, nCats, state.metrics, t.rects, t.fails, t.notes, pagerPool(slots.slice())); } catch (e) { t.fails.push(String(e.message || e)); }
      slabOk = !t.fails.length;
      if (!slabOk) notes.push(`selector ${id} opens over the whole body: a ${w0}px slab leaves ${slabBody.w}px, and the ${state.page} page then fails (${t.fails[0]})`);
    }
    if (slabOk) {
      panelMode = 'slab';
      const cols = cols0, w = w0;
      const px = side === 'left' ? body.x : body.x + body.w - w;
      const usedRows = Math.ceil(nOpt / cols);
      rects.push(R('sel-panel', px, body.y, w, body.h, { kind: 'panel', opts: nOpt, cols, pages: 1, rowH, content: [w, Math.min(body.h, 2 * PAD + usedRows * rowH)] }));
      assertPanelContent(id, Math.floor(w / cols) - 2 * PAD, fails);
      panelFacts = { mode: 'slab', cols, rows: usedRows, pages: 1, rowH, w, h: body.h };
      body = side === 'left' ? { x: body.x + w + GAP, y: body.y, w: body.w - w - GAP, h: body.h }
        : { x: body.x, y: body.y, w: body.w - w - GAP, h: body.h };
      rects.push(R('panel-gutter', side === 'left' ? body.x - GAP : body.x + body.w, body.y, GAP, body.h, { kind: 'gutter' }));
    } else {
      panelMode = 'full';
      const g = gridPage(body.w, body.h - 2 * PAD, nOpt, PANEL_W[id], rowH, BAR_H);
      rects.push(R('sel-panel', body.x, body.y, body.w, body.h, { kind: 'panel', opts: nOpt, cols: g.cols, pages: g.pages, rowH, content: [body.w, body.h] }));
      assertPanelContent(id, Math.floor(body.w / Math.max(1, g.cols)) - 2 * PAD, fails);
      panelFacts = { mode: 'full', cols: g.cols, rows: g.rows, pages: g.pages, rowH, w: body.w, h: body.h };
      if (colsCanSlab < colsWanted) notes.push(`selector ${id} opens over the whole body: a slab would leave under the ${CHART_MIN_W}px chart minimum`);
      body = null;
    }
  }

  // --- the page
  const before = rects.length;
  const page = body ? layPage(state.page, body, nCats, state.metrics, rects, fails, notes, pagerPool(slots)) : { hidden: 'selector open' };
  // No dead band: a page has to use the body it was given. Measured as the share of the body covered
  // by the page's own rectangles, gutters excluded, because a gutter is separation and a band of
  // nothing under the last row is not. The relationships matrix is the one exemption, and it is a
  // named cost in docs/LAYOUT.md: its cells are square and the body is not, so it reports the share
  // it leaves instead of failing on it.
  if (body) {
    // A separation counts as used space; a band of nothing does not. The widest legitimate
    // separation on a page is the slack a control band leaves around its 44px target, plus one gap,
    // so a gutter at or under that is furniture and anything thicker is a dead band.
    const SEP_MAX = GAP + (BAR_H - TARGET);
    const mine = rects.slice(before).filter(r => r.kind && (r.kind !== 'gutter' || Math.min(r.w, r.h) <= SEP_MAX));
    const covered = mine.reduce((a, r) => {
      const w = Math.max(0, Math.min(r.x + r.w, body.x + body.w) - Math.max(r.x, body.x));
      const h = Math.max(0, Math.min(r.y + r.h, body.y + body.h) - Math.max(r.y, body.y));
      return a + w * h;
    }, 0);
    const share = covered / Math.max(1, body.w * body.h);
    page.bodyFill = +share.toFixed(3);
    if (share < BODY_FILL_MIN) {
      const msg = `the ${state.page} page fills ${Math.round(100 * share)}% of its ${body.w}x${body.h} body, leaving a dead band`;
      if (state.page === 'relationships') notes.push(msg + ' (square cells in a body that is not square: a named cost)');
      else fails.push(msg);
    }
  }

  // --- account for every remaining pixel, then assert
  const pad = [
    R('stats-pad-top', area.x, area.y, area.w, PAD, { kind: 'pad' }),
    R('stats-pad-bottom', area.x, area.y + area.h - PAD, area.w, PAD, { kind: 'pad' }),
    R('stats-pad-left', area.x, area.y + PAD, PAD, area.h - 2 * PAD, { kind: 'pad' }),
    R('stats-pad-right', area.x + area.w - PAD, area.y + PAD, PAD, area.h - 2 * PAD, { kind: 'pad' }),
  ];
  const named = rects.concat(pad);
  const tiled = named.concat(gutterRects(area, named));

  assertNoOverlap(tiled, fails);
  assertInside(tiled, area, fails);
  assertTiles(tiled, area, fails);
  for (const r of rects) {
    if (!r.content) continue;
    r.fill = +((r.content[0] * r.content[1]) / Math.max(1, r.w * r.h)).toFixed(3);
    if (r.fill < FILL_MIN) notes.push(`${r.id} fill ${Math.round(r.fill * 100)}%`);
  }
  return { form, state, area, rects: tiled, page, fails, notes, panelMode, panelFacts, tabsMode, controlH, oneRow, ok: !fails.length };
}

// What an open selector panel actually has to hold, checked against the column it got. The option
// lists are bounded by their measured longest option, which PANEL_W already reserves; the legend is
// prose, so every one of its lines is checked against the column width in the same measured units.
function assertPanelContent(id, colInner, fails) {
  if (id !== 'legend') return;
  for (const line of LEGEND) {
    const need = Math.ceil(line.length * LEGEND_CHAR_W);
    if (need > colInner) { fails.push(`legend line "${line.slice(0, 24)}..." needs ${need}px, the column is ${colInner}px`); return; }
  }
}

// Every page lays its own body, and returns the facts the report prints.
function layPage(page, body, nCats, nMetrics, rects, fails, notes, pager) {
  if (page === 'trends') {
    // One panel per selected metric, each with its own value axis in its own unit, as small multiples.
    // Metrics in different units never share an axis: a reader decodes a line by its position against a
    // scale (Cleveland & McGill 1984), so drawing a 0-1 stress level and a share of hostile cats against
    // one 0-100% axis does not crowd the reading, it falsifies it. Repeating the same time axis down the
    // page and varying only the metric is the display Tufte calls small multiples, and it is read by
    // scanning rather than by switching series.
    //
    // Inside a panel the shelter aggregate is the solid line and each selected cat is a thin line, so
    // the colony and the individual are on one common scale where that comparison is meaningful: the
    // same quantity, the same unit, the same axis.
    const n = Math.max(1, nMetrics);
    // One key for the whole page, not one per panel. Every panel carries the same series (the aggregate
    // and the selected cats), and naming them once is the entire economy of a small-multiple display.
    const nKey = 1 + nCats;
    const keyCellW = Math.max(TX('optCat'), TX('keyAggregate')) + SWATCH;
    const keyCols = Math.max(1, Math.floor((body.w + GAP) / (keyCellW + GAP)));
    const pagerH = pager.free() ? 0 : BAR_H;
    // The key takes up to three rows, and never a row the panels wanted. A band that costs the page a
    // row of charts, or an extra page of them, has stopped being furniture and started being content;
    // below the rows it needs it pages, and where even one row would cost a panel row the series are
    // labelled at the right-hand end of each line instead. Direct labelling is the better form anyway
    // (Tufte; Few: a legend makes the reader look away from the data).
    const bare = trendPage(body.w, body.h, n, pagerH);
    const wantRows = Math.ceil(nKey / keyCols);
    let keyRows = Math.min(3, wantRows), keyH = 0;
    for (; keyRows >= 1; keyRows--) {
      const kh = keyRows * LINE + 2 * 6;
      const g2 = trendPage(body.w, body.h - kh - GAP, n, pagerH);
      if (g2.gridH >= TREND_MIN_H && g2.rows === bare.rows && g2.pages === bare.pages) { keyH = kh; break; }
    }
    if (!keyH) keyRows = 0;
    const keyMode = keyRows === 0 ? 'direct' : keyRows < wantRows ? 'paged' : 'band';
    const gridH = keyH ? body.h - keyH - GAP : body.h;
    if (gridH < TREND_MIN_H) fails.push(`trends panel ${gridH}px < ${TREND_MIN_H}px`);

    const g = trendPage(body.w, gridH, n, pagerH);
    const grid = { x: body.x, y: body.y, w: body.w, h: g.gridH };
    const shown = Math.min(n, g.cols * g.rows);
    if (g.pages > 1 && !g.pagerInSelector) {
      if (gridH - grid.h - TARGET > 0) rects.push(R('trends-pager-gutter', body.x, body.y + grid.h, body.w, gridH - grid.h - TARGET, { kind: 'gutter' }));
      const where = pager.claim({ x: body.x, y: body.y, w: body.w, h: gridH }, rects, 'trends-pager');
      notes.push(`trends shows ${shown} of ${n} metric panels, ${g.cols}x${g.rows}, ${g.pages} pages, pager in the ${where}`);
    } else if (g.pages > 1) {
      notes.push(`trends shows ${shown} of ${n} metric panels, ${g.cols}x${g.rows}: no row to spare for a pager, so the metrics selector steps through them`);
    }
    const cell = layGrid(grid, 'trend', shown, g.cols, g.rows, rects);
    layGutters(grid, g.cols, g.rows, rects, 'trend');
    if (cell.cellW < TREND_MIN_W) fails.push(`trends panel ${cell.cellW}px wide < ${TREND_MIN_W}px`);
    if (cell.cellH < TREND_MIN_H) fails.push(`trends panel ${cell.cellH}px tall < ${TREND_MIN_H}px`);
    if (keyH) {
      rects.push(R('trends-gutter', body.x, body.y + gridH, body.w, GAP, { kind: 'gutter' }));
      rects.push(R('chart-key', body.x, body.y + gridH + GAP, body.w, keyH, { kind: 'key', rows: keyRows, cols: keyCols, mode: keyMode, content: [Math.min(body.w, keyCols * (keyCellW + GAP) - GAP), keyH] }));
    }
    return { form: 'small multiples', metrics: n, cols: g.cols, rows: g.rows, pages: g.pages, shown,
      pagerInSelector: !!g.pagerInSelector, panel: [cell.cellW, cell.cellH],
      keyRows: keyH ? keyRows : 0, keyCols, keyMode };
  }
  if (page === 'percat') {
    // Small multiples: the same chart repeated once per cat on one shared scale, so the colony is read
    // by scanning rather than by switching series (Tufte; Few on trellis displays).
    const g = gridPage(body.w, body.h, nCats, SM_MIN_W, SM_MIN_H, pager.free() ? 0 : BAR_H);
    const grid = { x: body.x, y: body.y, w: body.w, h: g.pages > 1 ? g.gridH : body.h };
    if (g.pages > 1) {
      if (body.h - grid.h - TARGET > 0) rects.push(R('percat-gutter', body.x, body.y + grid.h, body.w, body.h - grid.h - TARGET, { kind: 'gutter' }));
      const where = pager.claim(body, rects, 'percat-pager');
      notes.push(`per cat pages ${g.cols}x${g.rows} = ${g.cols * g.rows} of ${nCats} cats, ${g.pages} pages, pager in the ${where}`);
    }
    const shown = Math.min(nCats, g.cols * g.rows);
    const cell = layGrid(grid, 'sm', shown, g.cols, g.rows, rects);
    layGutters(grid, g.cols, g.rows, rects, 'sm');
    if (cell.cellW < SM_MIN_W) fails.push(`small multiple ${cell.cellW}px wide < ${SM_MIN_W}px`);
    if (cell.cellH < SM_MIN_H) fails.push(`small multiple ${cell.cellH}px tall < ${SM_MIN_H}px`);
    return { cols: g.cols, rows: g.rows, pages: g.pages, shown, cell: [cell.cellW, cell.cellH] };
  }
  if (page === 'distribution') {
    // A histogram for the shape of the colony's Cat-Stress-Score, a dot plot for who sits where in it
    // (Cleveland's dot plot beats a bar chart for a ranked list of labelled values), and the
    // activity-by-hour profile as bars on a common baseline.
    // The shelter-wide scalars are the fourth panel here, and no longer a band squeezed over the colony
    // table. They are colony-wide readings, which is what this page is; on the colony page they were a
    // header about the shelter sitting on a table about cats, and they were paged on every viewport
    // because the table would not spare them the rows.
    const panels = [
      { id: 'dist-hist', minW: HIST_MIN_W, minH: CHART_MIN_H },
      { id: 'dist-hour', minW: HOUR_MIN_W, minH: CHART_MIN_H },
      { id: 'dist-dots', minW: DOT_MIN_W, minH: CHART_MIN_H },
      // A list has a natural height and a chart does not, so the totals panel asks for exactly the rows
      // it has and the charts share what is left rather than all four splitting the column evenly.
      { id: 'dist-totals', minW: TOTAL_CELL + 2 * PAD, minH: 2 * LINE + 2 * 6, list: true },
    ];
    const out = packPanels(panels, body, rects, fails, notes, 'dist', pager);
    // The totals panel is a list, so it lays itself out in the rectangle it ended up with and pages its
    // own rows where they do not all fit, exactly as the band used to.
    // The dot plot is one row per cat, so what it can show is a fact about its height, not a detail.
    // Where it cannot show the colony it pages, and says so, like the matrix and the table do.
    const dr = rects.find(r => r.id === 'dist-dots');
    if (dr) {
      const fit = Math.max(1, Math.floor((dr.h - LINE - 2 * 6) / LINE));
      Object.assign(dr, { rows: Math.min(fit, nCats), pages: Math.ceil(nCats / fit) });
      out.dots = { rows: dr.rows, of: nCats, pages: dr.pages };
      if (dr.rows < nCats) notes.push(`per-cat dot plot shows ${dr.rows} of ${nCats} cats, ${dr.pages} pages`);
    }
    const tr = rects.find(r => r.id === 'dist-totals');
    if (tr) {
      const tc = Math.max(1, Math.floor((tr.w - 2 * PAD + GAP) / (TOTAL_CELL + GAP)));
      const fit = Math.max(1, Math.floor((tr.h - LINE - 2 * 6) / LINE));
      const want = Math.ceil(N_TOTALS / tc);
      Object.assign(tr, { kind: 'totals', cols: tc, rows: Math.min(want, fit), mode: want > fit ? 'paged' : 'band' });
      out.totals = { cols: tc, rows: tr.rows, mode: tr.mode, of: N_TOTALS };
      if (tr.mode === 'paged') notes.push(`shelter totals show ${tr.rows * tc} of ${N_TOTALS} scalars at a time, ${tc} columns, paged`);
    }
    return out;
  }
  if (page === 'relationships') {
    // The affinity matrix, and the fear matrix, chosen in the metrics selector. A matrix is the right
    // form for a directed value over every ordered pair: the cell position carries who feels it about
    // whom, which no run of bars can (Few, on matrices and heat grids).
    // The block does not have to be square: the body is wider than it is tall, so the columns run to the
    // full colony where they fit and only the rows page. Paging one axis beats paging both, which would
    // put the same pair three moves away.
    const fitC = cell => Math.max(0, Math.min(Math.floor((body.w - ROWLAB) / cell), nCats));
    const fitR = (cell, h) => Math.max(0, Math.min(Math.floor((h - cell) / cell), nCats));
    let cell = CELL_FULL, kc = fitC(cell), kr = fitR(cell, body.h), pagerH = 0;
    if (kc < nCats || kr < nCats) {
      pagerH = pager.free() ? 0 : BAR_H; kr = fitR(cell, body.h - pagerH);
      if (kr < MATRIX_MIN_BLOCK || kc < MATRIX_MIN_BLOCK) { cell = CELL_MIN; kc = fitC(cell); kr = fitR(cell, body.h - pagerH); }
    }
    if (kr >= MATRIX_MIN_BLOCK && kc >= MATRIX_MIN_BLOCK) {
      if (kr < nCats || kc < nCats) {
        const where = pager.claim(body, rects, 'matrix-pager');
        notes.push(`matrix shows ${kr} of ${nCats} rows x ${kc} of ${nCats} columns at a ${cell}px cell, ${Math.ceil(nCats / kr)} row pages x ${Math.ceil(nCats / kc)} column pages, pager in the ${where}`);
      }
      const gw = ROWLAB + kc * cell, gh = cell + kr * cell;
      rects.push(R('matrix', body.x, body.y, gw, gh, { kind: 'matrix', block: kr, cols: kc, cell, content: [gw, gh] }));
      if (gw * gh < 0.6 * body.w * body.h) notes.push(`matrix fills ${Math.round(100 * gw * gh / (body.w * body.h))}% of the body: the grid is square-celled, and the body is not`);
      return { form: 'matrix', rows: kr, cols: kc, cell, rowPages: Math.ceil(nCats / kr), colPages: Math.ceil(nCats / kc), size: [gw, gh] };
    }
    const k = Math.min(kr, kc);
    // Too short for a block worth comparing: one cat's outgoing affinities, as labelled rows.
    const n = nCats - 1;
    const g = gridPage(body.w, body.h, n, AFF_ROW_W, TARGET, pager.free() ? 0 : BAR_H);
    const grid = { x: body.x, y: body.y, w: body.w, h: g.pages > 1 ? g.gridH : body.h };
    if (g.pages > 1) {
      if (body.h - grid.h - TARGET > 0) rects.push(R('aff-gutter', body.x, body.y + grid.h, body.w, body.h - grid.h - TARGET, { kind: 'gutter' }));
      pager.claim(body, rects, 'aff-pager');
    }
    notes.push(`matrix block would be ${k}x${k}, under ${MATRIX_MIN_BLOCK}: the page shows one cat's affinities as ${g.cols}x${g.rows} rows over ${g.pages} page(s)`);
    const shown = Math.min(n, g.cols * g.rows);
    const cellR = layGrid(grid, 'aff', shown, g.cols, g.rows, rects);
    layGutters(grid, g.cols, g.rows, rects, 'aff');
    if (cellR.cellW < AFF_ROW_W) fails.push(`affinity row ${cellR.cellW}px < ${AFF_ROW_W}px`);
    if (cellR.cellH < TARGET) fails.push(`affinity row ${cellR.cellH}px < ${TARGET}px`);
    return { form: 'rows', cols: g.cols, rows: g.rows, pages: g.pages, shown, cell: [cellR.cellW, cellR.cellH] };
  }
  if (page === 'table') {
    // The per-cat time-use numbers and the shelter scalars, as a table: these are looked up as values,
    // not read as a shape, and a table is the honest form for that (Few: use a table when the reader
    // wants a number rather than a trend).
    const rest = { x: body.x, y: body.y, w: body.w, h: body.h };
    const colsFit = Math.max(1, Math.floor((rest.w - TCOL_NAME) / TCOL));
    if (colsFit < MIN_TABLE_COLS) return layRecord(rest, nCats, rects, fails, notes, colsFit);
    const headH = 2 * LINE;
    let rowsFit = Math.max(1, Math.floor((rest.h - headH) / LINE)), pagerH = 0;
    if (colsFit < N_TABLE_COLS || rowsFit < nCats) {
      pagerH = pager.free() ? 0 : BAR_H;
      rowsFit = Math.max(1, Math.floor((rest.h - pagerH - headH) / LINE));
      const where = pager.claim(rest, rects, 'table-pager');
      notes.push(`colony table pages ${Math.min(colsFit, N_TABLE_COLS)} of ${N_TABLE_COLS} columns and ${Math.min(rowsFit, nCats)} of ${nCats} cats, pager in the ${where}`);
    }
    const cols = Math.min(colsFit, N_TABLE_COLS);
    const rows = Math.min(rowsFit, nCats, Math.floor((rest.h - pagerH - headH) / LINE));
    if (rows < 1) { fails.push(`colony table has room for ${rows} rows, short ${headH + LINE + pagerH - rest.h}px`); return { cols, rows: 0 }; }
    // The table takes the whole body, less a pager row where there is one. TCOL and LINE are minima,
    // not the sizes to draw at: with 13 cats in a 404px body a LINE-tall row left 89px of dead band
    // under the last row, which is space the page was given and did not use. So the row height and
    // the column width are derived from what is there, with the minima as floors, and the name
    // column takes the rounding so the table ends exactly on the body edge.
    const availH = rest.h - pagerH, availW = rest.w;
    const rowH = Math.max(LINE, Math.floor((availH - headH) / rows));
    const colW = Math.max(TCOL, Math.floor((availW - TCOL_NAME) / cols));
    const nameW = availW - cols * colW;
    const headTall = availH - rows * rowH;
    const tw = availW, th = availH;
    rects.push(R('table', rest.x, rest.y, tw, th, { kind: 'table', cols, rows, rowH, colW, nameW, headH: headTall, content: [tw, th] }));
    if (nameW < TCOL_NAME) fails.push(`colony table name column ${nameW}px, needs ${TCOL_NAME}px`);
    if (headTall < headH) fails.push(`colony table head ${headTall}px, needs ${headH}px`);
    return { cols, rows, rowH, colW, colPages: Math.ceil(N_TABLE_COLS / cols), rowPages: Math.ceil(nCats / rows), size: [tw, th] };
  }
  throw new Error('unknown page ' + page);
}

// The colony page where it cannot be a table: one cat, all eleven of its numbers as label-value rows,
// and the cats selector is the pager. A caregiver who wants Nachshon picks Nachshon by name instead of
// stepping through a grid of two columns by four cats looking for him, and a cat read whole is a cat
// you can actually read: two metrics beside a name is a list that has been made to look like a table.
// The shelter totals keep their band above, and the selector carries one extra entry, "Shelter", whose
// page is the totals in the same rows: the one page that is not about a cat is reached the same way as
// the ones that are.
function layRecord(rest, nCats, rects, fails, notes, colsFit) {
  const need = N_TABLE_COLS;
  let cols = 0, rowsPer = 0;
  for (let c = 1; c <= 3; c++) {
    const cw = Math.floor((rest.w - (c - 1) * GAP) / c);
    if (cw < RECORD_ROW_W) break;
    const rpc = Math.ceil(need / c);
    if (RECORD_HEAD_H + rpc * LINE <= rest.h) { cols = c; rowsPer = rpc; break; }
  }
  if (!cols) {
    const cw = Math.floor((rest.w - 2 * GAP) / 3);
    const best = cw >= RECORD_ROW_W ? 3 : (Math.floor((rest.w - GAP) / 2) >= RECORD_ROW_W ? 2 : 1);
    fails.push(`one-cat colony page: ${need} rows in ${best} column(s) need ${RECORD_HEAD_H + Math.ceil(need / best) * LINE}px, the page has ${rest.h}px (only ${colsFit} table column(s) fit)`);
    return { form: 'record', cols: best, rows: 0 };
  }
  // Same rule as the table: the rows take the body rather than leaving a band under the last one.
  const rowH = Math.max(LINE, Math.floor((rest.h - RECORD_HEAD_H) / rowsPer));
  const headTall = rest.h - rowsPer * rowH;
  const h = rest.h;
  rects.push(R('record', rest.x, rest.y, rest.w, h, { kind: 'record', cols, rows: rowsPer, rowH, headH: headTall, pages: nCats, content: [rest.w, h] }));
  notes.push(`colony page shows one cat at a time: all ${need} label-value rows in ${cols} column(s), ${nCats} pages, paged by the cats selector`);
  return { form: 'record', cols, rows: rowsPer, rowsShown: need, pages: nCats, size: [rest.w, h] };
}

// Packs named panels into the body: side by side where each clears its own minimum width, stacked where
// it does not, one at a time behind a pager where neither fits.
function packPanels(panels, body, rects, fails, notes, prefix, pager) {
  // Every way of cutting the ordered panels into contiguous columns, from one column to one per panel.
  // A column is as wide as its widest panel needs, the slack is shared out, and the arrangement that
  // gives the smallest panel the most area wins. This is what keeps the body full rather than letting
  // one chart sprawl while two others wait behind a pager.
  const cuts = [];
  (function walk(i, acc) {
    if (i === panels.length) { if (acc.length) cuts.push(acc.slice()); return; }
    for (let k = 1; i + k <= panels.length; k++) { acc.push(panels.slice(i, i + k)); walk(i + k, acc); acc.pop(); }
  })(0, []);
  let best = null;
  for (const cols of cuts) {
    const minW = cols.map(c => Math.max(...c.map(p => p.minW)));
    const need = minW.reduce((a, b) => a + b, 0) + (cols.length - 1) * GAP;
    if (need > body.w) continue;
    const hs = cols.map(c => {
      const free = c.filter(p => !p.list);
      if (!free.length) return Math.floor((body.h - (c.length - 1) * GAP) / c.length);
      const listH = c.filter(p => p.list).reduce((a, p) => a + listHeight(p, minW[cols.indexOf(c)] || p.minW), 0);
      return Math.floor((body.h - (c.length - 1) * GAP - listH) / free.length);
    });
    if (cols.some((c, i) => hs[i] < Math.max(...c.filter(p => !p.list).map(p => p.minH), 0))) continue;
    if (cols.some((c, i) => c.some(p => p.list ? false : hs[i] < p.minH))) continue;
    const slack = body.w - need, add = share(slack, cols.length);
    const ws = minW.map((w, i) => w + add[i]);
    const score = Math.min(...cols.map((c, i) => ws[i] * hs[i]));
    if (!best || score > best.score) best = { cols, ws, hs, score };
  }
  if (best) {
    let x = body.x;
    best.cols.forEach((c, i) => {
      const listH = c.map(p => p.list ? listHeight(p, best.ws[i]) : 0);
      const freeIx = c.map((p, j) => p.list ? -1 : j).filter(j => j >= 0);
      const rest = body.h - (c.length - 1) * GAP - listH.reduce((a, b) => a + b, 0);
      const even = share(rest, Math.max(1, freeIx.length));
      // A column of lists alone has no chart to give its slack to, so its lists share the column rather
      // than leaving a dead band under their natural height (the totals panel, on a wide short body).
      const alone = freeIx.length ? null : share(body.h - (c.length - 1) * GAP, c.length);
      const hsplit = c.map((p, j) => alone ? alone[j] : p.list ? listH[j] : even[freeIx.indexOf(j)]);
      let y = body.y;
      c.forEach((p, j) => {
        rects.push(R(p.id, x, y, best.ws[i], hsplit[j], { kind: 'chart', content: [best.ws[i], hsplit[j]] }));
        y += hsplit[j];
        if (j < c.length - 1) { rects.push(R(`${prefix}-hgut-${i}-${j}`, x, y, best.ws[i], GAP, { kind: 'gutter' })); y += GAP; }
      });
      x += best.ws[i];
      if (i < best.cols.length - 1) { rects.push(R(`${prefix}-gut-${i}`, x, body.y, GAP, body.h, { kind: 'gutter' })); x += GAP; }
    });
    return { mode: best.cols.map(c => c.length).join('+'), cols: best.cols.length, each: [best.ws[0], best.hs[0]] };
  }

// ---------------------------------------------------------------- regions
// One element per solved rectangle, created on first sight and positioned on every solve. A rectangle
// that leaves the solution takes its element with it, so there is never a second, stale copy of a
// region sitting behind the live one.
const regions = new Map();
const BUILD = {};

function regionEl(id) {
  let r = regions.get(id);
  if (!r) {
    const node = el('div', 'region');
    node.id = 'r-' + id;
    const build = BUILD[id] || BUILD[id.replace(/-\w+$/, '-*')] || BUILD['*'];
    r = { node, api: build(node, id) || {} };
    app.appendChild(node);
    regions.set(id, r);

}

// The layout state the engine is asked to solve. On a phone the readout and the editors are views
// rather than regions, which is the engine's own rule; this function only reports the state.
function layoutState() {
  return { editor: UI.editor.slice(), selected: !!UI.selected && FORM === 'desktop',
    view: UI.view, pointer: UI.pointer, burst: 1, labels: 'normal',
    marker: UI.marker && UI.view === 'room' ? UI.marker.kind : 'none' };
}

// Solve, then place. If a state cannot be solved the engine throws a Shortfall carrying the exact
// deficit; rather than drawing something unproved, the UI closes the most recently opened thing and
// says so in the console, which is the same order a caregiver would undo it in.
function applyLayout() {
  const W = innerWidth, H = innerHeight;
  FORM = LAY.formFor(W, H);
  if (FORM !== 'desktop' && UI.editor.length) { UI.view = UI.editor[0]; UI.editor = []; }
  let sol = null;
  for (let attempt = 0; attempt < 3 && !sol; attempt++) {
    try { sol = LAY.solve(W, H, Object.assign(layoutState(), { form: FORM })); }
    catch (e) {
      console.warn('layout shortfall: ' + e.message);
      if (UI.editor.length) UI.editor = [];
      else if (UI.selected) UI.selected = null;
      else throw e;
    }
  }
  SOL = sol;
  const live = new Set(sol.rects.map(r => r.id));
  for (const [id, r] of regions) if (!live.has(id)) { if (r.api.drop) r.api.drop(); r.node.remove(); regions.delete(id); }
  for (const r of sol.rects) {
    const reg = regionEl(r.id), s = reg.node.style;
    s.left = r.x + 'px'; s.top = r.y + 'px'; s.width = r.w + 'px'; s.height = r.h + 'px';
    if (reg.api.place) reg.api.place(r, sol);
  }
  renderAll();
}

BUILD['feed'] = node => {

    c.dataset.metric = m.name;

// The trend under a value: the same samples the statistics view draws, over the last 24 sim-hours,

// ---------------------------------------------------------------- the view

  room.appendChild(cv);

  inspector.classList.add('pane'); controls.classList.add('pane', 'controlsview');
  const editors = {};

  const built = {};
  node.append(room, stats, guide, inspector, controls, editors.feeding, editors.vacuum, editors.visitors);
  const api = { room, cv, stats, guide, inspector, controls, editors };

// Phone landscape has no column for the budget cards, so they live behind one Controls button. The

  function paginate() {
    if (!pages || !pages.clientHeight) return;
    const limit = pages.clientHeight;
    // Measure every section once, in a page-width box that is laid out but not shown.
    const probe = el('div', 'page');

    pages.textContent = '';

    const blocks = [];

    for (const d of out[UI.guidePage]) shown.appendChild(d);

})();

    for (const col of TABLE_COLS) {

      const a = el('span', null, tableHeader(col, row ? [row] : [])); a.style.cssText = 'color:var(--muted);overflow:hidden;text-overflow:ellipsis';
      const b = el('span', null, String(row ? tableValue(row, col) : '-')); b.style.cssText = 'margin-left:auto;font-weight:var(--fw-bold);font-variant-numeric:tabular-nums';
      r.append(a, b); grid.appendChild(r);
    }
    m.box.appendChild(grid);
  }
  function renderKey(m) {
    const q = m.rect;
    if (!m.box) { m.node.textContent = ''; m.box = el('div', 'keyband'); m.node.appendChild(m.box); }
    m.box.style.gridTemplateColumns = `repeat(${q.cols || 1},minmax(0,1fr))`;
    m.box.textContent = '';
    const rows = [{ name: 'Shelter aggregate', st: { color: TK.color.ink, dash: [] }, w: 3, id: null }]
      .concat(selectedCats().map(c => ({ name: c.name, st: catLine(c), w: 2, id: c.id })));
    const cap = (q.rows || 1) * (q.cols || 1), page = pageAt('key') % Math.max(1, Math.ceil(rows.length / cap));
    for (const r of rows.slice(page * cap, page * cap + cap)) {
      const k = el('div', 'k'); const i = document.createElement('i');
      i.style.borderTop = `${r.w}px ${r.st.dash.length ? (r.st.dash[0] > r.w ? 'dashed' : 'dotted') : 'solid'} ${r.st.color}`;
      k.append(i, el('span', null, r.name)); m.box.appendChild(k);
      if (r.id != null) {
        k.onmouseenter = () => { UI.stats.hl = r.id; render(); };
        k.onmouseleave = () => { UI.stats.hl = null; render(); };
